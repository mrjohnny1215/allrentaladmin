<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접수신청 - ALL & UP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<link rel="stylesheet" href="./assets/style/button_style.css">
<link rel="stylesheet" href="./assets/style/button_animation.css">
<style>
body{font-family:'cafe',sans-serif;background:#f5f7fa;}
.card-box{background:#fff;border-radius:0.75rem;padding:1.25rem;box-shadow:0 0 30px rgba(0,0,0,0.1);margin-bottom:1rem;}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:0.75rem;color:#333;}
.required{color:#dc3545;}
.form-label{font-weight:600;font-size:0.9rem;}
#applySubmitBtn:disabled{opacity:0.6;cursor:not-allowed;}
</style>
<script src="/pages/legacy-api.js"></script>
</head>
<body>
<div class="container py-3">
  <h4 class="mb-3">접수신청</h4>

  <!-- 토크노 정보/상태 표시 -->
  <div id="linkInfo" class="card-box" style="display:none;">
    <div class="section-title">상품 정보</div>
    <div id="linkProductInfo"></div>
    <div id="linkStatus" class="mt-2"></div>
  </div>

  <!-- 접수 폼 -->
  <form id="applyForm" autocomplete="off">
    <div class="card-box">
      <div class="section-title">고객 정보</div>
      <div class="mb-3">
        <label class="form-label">고객명 <span class="required">*</span></label>
        <input type="text" class="form-control" name="customer_name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">생년월일</label>
        <input type="text" class="form-control" name="birth_date" placeholder="예: 880101">
      </div>
      <div class="mb-3">
        <label class="form-label">연락처 <span class="required">*</span></label>
        <input type="text" class="form-control" name="contact" required placeholder="예: 010-1234-5678">
      </div>
      <div class="mb-3">
        <label class="form-label">결제정보</label>
        <input type="text" class="form-control" name="payment_info" placeholder="카드명/계좌 등 최소 정보">
      </div>
    </div>

    <div class="card-box">
      <div class="section-title">설치 주소</div>
      <div class="mb-3">
        <label class="form-label">우편번호</label>
        <div class="input-group">
          <input type="text" class="form-control" name="zipcode" id="zipcode" readonly>
          <button type="button" class="btn btn-outline-secondary" id="searchAddressBtn">주소검색</button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">기본주소</label>
        <input type="text" class="form-control" name="address_basic" id="address_basic" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label">상세주소</label>
        <input type="text" class="form-control" name="address_detail">
      </div>
    </div>

    <div class="card-box">
      <div class="section-title">추가 요청사항</div>
      <div class="mb-3">
        <label class="form-label">특이사항</label>
        <textarea class="form-control" name="special_note" rows="3" placeholder="설치 요청, 연락 가능 시간 등"></textarea>
      </div>
    </div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary btn-lg" id="applySubmitBtn">접수 신청</button>
    </div>
  </form>

  <div id="resultBox" class="mt-3" style="display:none;"></div>
</div>

<script>
(() => {
  'use strict';
  const pathParts = location.pathname.split('/').filter(Boolean);
  const token = pathParts[pathParts.length - 1] || '';
  if (!token) {
    document.getElementById('applyForm').insertAdjacentHTML('beforebegin',
      '<div class="alert alert-danger">잘못된 접근입니다. 링크를 확인해주세요.</div>');
    document.getElementById('applySubmitBtn').disabled = true;
    return;
  }

  const loadLink = async () => {
    try {
      const res = await fetch('customer_apply_detail.php?token=' + encodeURIComponent(token));
      const j = await res.json();
      if (!j.success || !j.payload) {
        document.getElementById('linkInfo').style.display = 'none';
        document.getElementById('applySubmitBtn').disabled = true;
        document.getElementById('applyForm').insertAdjacentHTML('beforebegin',
          '<div class="alert alert-warning">만료되었거나 유효하지 않은 링크입니다.</div>');
        return;
      }
      const p = j.payload || {};
      const statusEl = document.getElementById('linkStatus');
      if (j.status === '취소') {
        statusEl.innerHTML = '<div class="alert alert-danger">이 링크는 취소되었습니다.</div>';
        document.getElementById('applySubmitBtn').disabled = true;
      } else if (j.status === '사용완료') {
        statusEl.innerHTML = '<div class="alert alert-info">이미 접수가 완료된 링크입니다.</div>';
        document.getElementById('applySubmitBtn').disabled = true;
      }
      document.getElementById('linkProductInfo').innerHTML = [
        esc(p.brand || ''),
        esc(p.product_name || ''),
        esc(p.regulation || ''),
        esc(p.contract_period || ''),
        esc(p.management_cycle || ''),
        esc(p.rental_fee || '') ? (esc(p.rental_fee) + '원') : ''
      ].filter(Boolean).join('<br>');
      document.getElementById('linkInfo').style.display = 'block';
    } catch (e) {
      console.error('[apply] load link error', e);
    }
  };

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('applySubmitBtn');
    btn.disabled = true;
    try {
      const form = e.target;
      const payload = {
        token,
        customer_name: form.customer_name.value.trim(),
        birth_date: form.birth_date.value.trim(),
        contact: form.contact.value.trim(),
        payment_info: form.payment_info.value.trim(),
        addresses: [{
          zip: form.zipcode.value.trim(),
          basic: form.address_basic.value.trim(),
          detail: form.address_detail.value.trim()
        }],
        special_note: form.special_note.value.trim(),
        product_name: (document.getElementById('linkProductInfo')?.textContent || '').trim()
      };
      const fd = new FormData();
      fd.append('action', 'customer_submit');
      fd.append('token', token);
      fd.append('payload', JSON.stringify(payload));
      const res = await fetch('save_json.php', { method: 'POST', body: fd });
      const j = await res.json();
      if (j.success) {
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resultBox').innerHTML = '<div class="alert alert-success">접수가 완료되었습니다! 담당자가 확인 후 연락드리겠습니다.</div>';
        form.reset();
      } else {
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resultBox').innerHTML = '<div class="alert alert-danger">' + esc(j.message || '제출 실패') + '</div>';
        btn.disabled = false;
      }
    } catch (err) {
      console.error('[apply] submit error', err);
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('resultBox').innerHTML = '<div class="alert alert-danger">제출 중 오류가 발생했습니다.</div>';
      btn.disabled = false;
    }
  });

  document.getElementById('searchAddressBtn')?.addEventListener('click', () => {
    if (window.daum && window.daum.Postcode) {
      new daum.Postcode({ oncomplete: function(data) {
        document.getElementById('zipcode').value = data.zonecode;
        document.getElementById('address_basic').value = data.address;
      } }).open();
    } else {
      alert('주소검색 서비스가 준비되지 않았습니다.');
    }
  });

  loadLink();
})();
</script>
</body>
</html>
