<body>


<div class="card-area">

  <div class="text-center mb-4">
    <div class="card-box d-inline-block position-relative">
      <div class="d-flex flex-wrap justify-content-center gap-2" id="thumbnailList"></div>
    </div>
  </div>

  <div class="slider-wrapper">
    <button class="slider-btn left-btn" onclick="showPrev()">&#9664;</button>
    <img id="cardImage" src="" alt="제휴카드 이미지">
    <button class="slider-btn right-btn" onclick="showNext()">&#9654;</button>
  </div>

</div> <!-- .card-area 끝 -->

<script>
const imageList = ["/card/8cescard.jpg?v=86f004e167506159c318b6e48440881c","/card/1cwcard.png?v=9a7f69f71fb058654a8ca610e32e2fcd","/card/2chcard.png?v=1e5d183557d76f36c45b70abbb8f1a83","/card/3skcard.png?v=03e53fdfdafa4a8efc4370c0f941f4b5","/card/4cccard.png?v=28e57d79f5259b3bea31357c4b63f028","/card/5lgcard.png?v=de0cd560d914d8c4815d40f8105cebbc","/card/6wscard.png?v=48992eccbfc31e8ea28d2d401cb07180","/card/7hdcard.png?v=b00f3b1c5248422a610af5653f1fb9ff"];
let currentIndex = 0;

// ★ 브랜드 버튼 설정: key = 파일명(확장자/쿼리 제외한 앞부분)
const buttonConfig = [
  { label: '코웨이', key: '1cwcard' },
  { label: '청호',  key: '2chcard' },
  { label: 'SK',    key: '3skcard' },
  { label: '쿠쿠',  key: '4cccard' },
  { label: '웰스',  key: '6wscard' },
  { label: 'LG',    key: '5lgcard' },
  { label: '현대',  key: '7hdcard' },
  { label: '세스코', key: '8cescard' },
];

// ★ URL에서 "파일명(확장자/쿼리 제외)"만 뽑기
function getBaseName(url) {
    if (!url) return '';
    const noQuery = url.split('?')[0]; // ?v= 제거
    const parts = noQuery.split('/');
    const file = parts[parts.length - 1] || '';
    const dotPos = file.lastIndexOf('.');
    return (dotPos >= 0 ? file.substring(0, dotPos) : file).toLowerCase();
}

function updateActiveButton() {
    const buttons = document.querySelectorAll('#thumbnailList .card-btn');
    buttons.forEach(btn => {
        const idx = parseInt(btn.dataset.index ?? '-1', 10);
        if (idx === currentIndex) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

function updateImage() {
    const imgEl = document.getElementById("cardImage");
    if (imageList.length === 0) {
        imgEl.src = "";
        imgEl.alt = "이미지를 불러올 수 없습니다.";
        return;
    }
    imgEl.src = imageList[currentIndex % imageList.length];
}

function showPrev() {
    if (imageList.length === 0) return;
    currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
    updateImage();
    updateActiveButton();
}

function showNext() {
    if (imageList.length === 0) return;
    currentIndex = (currentIndex + 1) % imageList.length;
    updateImage();
    updateActiveButton();
}

function generateThumbnails() {
    const container = document.getElementById("thumbnailList");
    container.innerHTML = ""; // 초기화

    buttonConfig.forEach(cfg => {
        // imageList에서 해당 key로 시작하는 파일 찾기 (확장자/쿼리 무시)
        const idx = imageList.findIndex(src =>
            getBaseName(src).startsWith(cfg.key.toLowerCase())
        );
        if (idx === -1) {
            // 해당 이미지가 없으면 버튼 생성하지 않음
            return;
        }

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card-btn";
        btn.textContent = cfg.label;
        btn.dataset.index = idx;

        btn.onclick = () => {
            currentIndex = idx;
            updateImage();
            updateActiveButton();
        };

        container.appendChild(btn);
    });
}

window.onload = () => {
    generateThumbnails(); // 버튼 생성
    updateImage();        // 초기 큰 이미지 표시
    updateActiveButton(); // 첫 버튼 active 표시
};

</script>
