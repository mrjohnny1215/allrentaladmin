<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제휴카드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

<style>
  html,body{height:100%;margin:0;background:#fff;font-family:'cafe',-apple-system,'Malgun Gothic',sans-serif}
  *{box-sizing:border-box}

  /* 모바일 최적화 래퍼 */
  .wrap{
    min-height:100%;
    width:100%;
    overflow:auto;
    display:flex; align-items:flex-start; justify-content:center;
    padding:10px;
    touch-action: pan-x pan-y;
  }

  /* ✅ 기본: 가로 100% 맞춤 (모바일 잘림 방지) */
  #cardImg{
    display:block;
    width:100%;          /* 화면 가로에 맞춤 */
    max-width:100%;
    height:auto;
    image-rendering:auto;
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
  }

  .empty{ color:#6b7280;text-align:center;padding:40px 12px;font-size:.95rem }

  /* 썸네일 리스트 (여러 카드) */
  .thumb-list{
    display:flex; gap:8px; overflow-x:auto; padding:8px;
    position:sticky; top:0; background:#fff; z-index:5;
    border-bottom:1px solid #eee;
  }
  .thumb-list img{
    width:64px; height:auto; border-radius:6px; border:2px solid transparent; cursor:pointer;
  }
  .thumb-list img.active{ border-color:#2f66ff; }

  /* 우하단 확대/축소 컨트롤 */
  .zoom-ctrl{
    position:fixed; right:12px; bottom:12px;
    display:flex; gap:6px; z-index:9999;
  }
  .zoom-ctrl .btn{
    border:1px solid #d1d5db; background:#fff; border-radius:8px;
    padding:8px 12px; font-size:15px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .zoom-ctrl .btn:active{ transform:translateY(1px); }
</style>
</head>
<body>
  <!-- 썸네일 (1장이면 단일 표시) -->
  <div class="thumb-list" id="thumbList"></div>

  <div class="wrap" id="wrap">
    <img id="cardImg" src="./assets/card/1cwcard.png" alt="제휴카드">
  </div>

  <div class="zoom-ctrl" aria-hidden="false">
    <button class="btn" id="fitBtn"    title="화면맞춤">맞춤</button>
    <button class="btn" id="actualBtn" title="원본크기">원본</button>
    <button class="btn" id="zoomOut"   title="축소">−</button>
    <button class="btn" id="zoomIn"    title="확대">＋</button>
  </div>

<script>
(function(){
  const img  = document.getElementById('cardImg');
  const wrap = document.getElementById('wrap');
  const thumbList = document.getElementById('thumbList');
  if (!img || !wrap) return;

  // 카드 이미지 목록 (필요시 여기에 추가)
  const CARDS = ['1cwcard'];

  // 썸네일 렌더
  if (thumbList && CARDS.length > 1) {
    CARDS.forEach((key, i) => {
      const t = document.createElement('img');
      t.src = './assets/card/' + key + '.png';
      t.className = i === 0 ? 'active' : '';
      t.addEventListener('click', () => {
        img.src = './assets/card/' + key + '.png';
        thumbList.querySelectorAll('img').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        fitMode();
      });
      thumbList.appendChild(t);
    });
  } else if (thumbList) {
    thumbList.style.display = 'none';
  }

  let mode = 'fit';   // 모바일 기본: 화면맞춤
  let zoom = 1;
  const START_FIT = true;

  function innerWidth(el){
    const cs = getComputedStyle(el);
    return el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  }

  function baseWidth(){
    const iw = Math.max(100, innerWidth(wrap));
    if (mode === 'fit')    return iw;
    if (mode === 'actual') return img.naturalWidth || img.width;
    return Math.min(700, iw);
  }

  function applyWidth(){
    const w = baseWidth() * zoom;
    img.style.width = Math.max(80, Math.round(w)) + 'px';
    img.style.height = 'auto';
  }

  function fitMode(){ mode='fit'; zoom=1; applyWidth(); wrap.scrollTop=0; wrap.scrollLeft=0; }
  function setZoom(next){ zoom = Math.max(0.5, Math.min(5, next)); applyWidth(); }

  // 초기: 모바일 기준 화면맞춤
  fitMode();

  document.getElementById('fitBtn')?.addEventListener('click', fitMode);
  document.getElementById('actualBtn')?.addEventListener('click', ()=>{ mode='actual'; zoom=1; applyWidth(); wrap.scrollTop=0; wrap.scrollLeft=0; });
  document.getElementById('zoomIn')?.addEventListener('click', ()=> setZoom(zoom*1.25));
  document.getElementById('zoomOut')?.addEventListener('click', ()=> setZoom(zoom/1.25));

  wrap.addEventListener('wheel', (e)=>{
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1/1.15));
    }
  }, {passive:false});

  // 더블탭: fit ↔ actual
  let lastTap = 0;
  wrap.addEventListener('click', ()=>{
    const now = Date.now();
    if (now - lastTap < 350){
      mode = (mode === 'fit') ? 'actual' : 'fit';
      zoom = 1; applyWidth(); wrap.scrollTop=0; wrap.scrollLeft=0;
    }
    lastTap = now;
  });

  window.addEventListener('resize', applyWidth);
  img.addEventListener('load', applyWidth);
})();
</script>
</body>
</html>
