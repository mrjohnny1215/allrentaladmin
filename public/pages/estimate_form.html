<script>
  // 연락처 하이픈 자동입력
document.getElementById('contact').addEventListener('input', function (e) {
  const input = e.target;
  const numbers = input.value.replace(/\D/g, ''); // 숫자만 추출

  let formatted = '';
  if (numbers.length <= 3) {
    formatted = numbers;
  } else if (numbers.length <= 7) {
    formatted = numbers.replace(/(\d{3})(\d{1,4})/, '$1-$2');
  } else if (numbers.length <= 11) {
    formatted = numbers.replace(/(\d{3})(\d{4})(\d{1,4})/, '$1-$2-$3');
  } else {
    formatted = numbers.slice(0, 11).replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  }

  input.value = formatted;
});

  // 연락처만 localStorage 저장
  window.addEventListener('DOMContentLoaded', () => {
    const field = 'contact';
    const saved = localStorage.getItem('estimate_' + field);
    if (saved) document.getElementById(field).value = saved;
    document.getElementById(field).addEventListener('input', () => {
      localStorage.setItem('estimate_' + field, document.getElementById(field).value);
    });

  // 담당자 localStorage 저장 및 불러오기
  const managerField = 'manager';
  const savedManager = localStorage.getItem('estimate_' + managerField);
  if (savedManager) document.getElementById(managerField).value = savedManager;
  else document.getElementById(managerField).value = ""; // 기본값 공백

  document.getElementById(managerField).addEventListener('input', () => {
    localStorage.setItem('estimate_' + managerField, document.getElementById(managerField).value);
  });
  });

$(document).on("change", ".brand", function () {
  const $table = $(this).closest("table");

  // 모든 input 초기화하되 qty와 note는 제외
  $table.find("input").each(function () {
    const cls = $(this).attr("class") || "";
    if (!cls.includes("qty") && !cls.includes("note")) {
      $(this).val("");
    }
  });

  // 수량과 특이사항은 기본값으로 되돌리기
  $table.find(".qty").val("1");
  $table.find(".note").val("설치비 면제 / 등록비 면제");
});

// "직접입력"이 선택된 경우 select → input 전환
$(document).on("change", ".brand", function () {
  const $select = $(this);
  const $td = $select.closest("td");
  const $customInput = $td.find(".brand-custom-handler");

  if ($select.val() === "custom") {
    $select.addClass("d-none");
    $customInput.removeClass("d-none").focus();
  } else {
    $customInput.addClass("d-none").val("");
  }
});

// 직접입력 input에서 포커스 아웃되면 원래 select로 복귀
$(document).on("blur", ".brand-custom-handler", function () {
  const $input = $(this);
  const $td = $input.closest("td");
  const $select = $td.find(".brand");

  if (!$input.val().trim()) {
    $input.addClass("d-none").val("");
    $select.removeClass("d-none").val("");
  }
});

$(document).on("change", ".product-name", function () {
  const $table = $(this).closest("table");
  $table.find(".rule, .management, .contract, .price, .total").val("");
});

$(document).on("change", ".rule", function () {
  const $table = $(this).closest("table");
  $table.find(".management, .contract, .price, .total").val("");
});
</script>

<script>
let worksheetData = [];

fetch('../data/estimate_ws.json', { credentials: "include", cache: "no-store" })
  .then(res => res.json())
  .then(data => {
    worksheetData = data;

    const $baseTable = $("#productTable");
    initializeAutocompleteFor($baseTable);

    const params = new URLSearchParams(location.search);
    const cartItems = Array.isArray(window.__ESTIMATE_CART_ITEMS) ? window.__ESTIMATE_CART_ITEMS : [];

    if (params.get('from_cart') === '1' && cartItems.length > 0) {
      prefillFromCart(cartItems);
    } else {
      prefillFromQuery($baseTable);
    }

    setTimeout(() => {
      renderMobileEstimateEditor();
    }, 0);
  })
  .catch(err => {
    console.error("데이터 로딩 실패", err);
    setTimeout(() => {
      renderMobileEstimateEditor();
    }, 0);
  });

function updateTotal($table) {
  const qty = parseInt($table.find(".qty").val().replace(/[^\d]/g, ""), 10) || 1;

  $table.find(".rental-set").each(function () {
    const $row = $(this);
    const $priceInput = $row.find(".price");
    const $totalInput = $row.find(".total");

    const unitPrice = parseInt($priceInput.val().replace(/[^\d]/g, ""), 10) || 0;
    const total = qty * unitPrice;

    $totalInput.val(total.toLocaleString());
  });
}

function fillProductInfo($table, productValue) {
  const [name, modelFromInput] = productValue.split("//").map(v => v.trim()); // 이름 충돌 방지
  const header = worksheetData[0];
  const getIndex = key => header.indexOf(key);

  const matchedRows = worksheetData.slice(1).filter(r =>
    r[getIndex("상품명")] === name && r[getIndex("모델명")] === modelFromInput
  );
  if (matchedRows.length === 0) return;

  const row = matchedRows[0];
  const model = row[getIndex("모델명")];  // 실제 모델명 값
  $table.find(".model").val(model);
  $table.find(".color").val(row[getIndex("색상")]);
  $table.find(".volume").val(row[getIndex("용량")]);
  $table.find(".size").val(row[getIndex("사이즈")]);
  $table.find(".product-img").attr("src", "?image=" + encodeURIComponent(name));

  const $ruleInput = $table.find(".rule");
  const $mgmtInput = $table.find(".management");

  // 규정 자동완성
  const ruleSet = new Set();
  matchedRows.forEach(r => {
    const val = r[getIndex("규정")];
    if (val) ruleSet.add(val.trim());
  });
  $ruleInput.autocomplete({
    source: Array.from(ruleSet),
    minLength: 0,
    appendTo: "body",
    select: () => $table.find(".management, .contract, .price, .total").val("")
  }).on("focus", function () {
    $(this).autocomplete("search", "");
  });

  // 관리유형 자동완성
  const selectedRule = $ruleInput.val()?.trim();
  const mgmtSet = new Set();
  matchedRows.forEach(r => {
    if (!selectedRule || r[getIndex("규정")]?.trim() === selectedRule) {
      [7, 11, 15, 19, 23, 31, 35].forEach(idx => {
        if (r[idx]) {
          r[idx].split(",").forEach(val => {
            const trimmed = val.trim();
            if (trimmed) mgmtSet.add(trimmed);
          });
        }
      });
    }
  });
  $mgmtInput.autocomplete({
    source: Array.from(mgmtSet),
    minLength: 0,
    appendTo: "body",
    select: () => $table.find(".contract, .price, .total").val("")
  }).on("focus", function () {
    if (!this.value) $(this).autocomplete("search", "");
    else $(this).autocomplete("close");
  });

  $ruleInput
    .off("change.rule blur.rule input.rule")
    .on("change.rule blur.rule input.rule", function () {
      const selectedRule = ($(this).val() || '').trim();

      // 1) 규정에 맞는 관리유형 목록 재생성
      const mgmtSet = new Set();
      matchedRows.forEach(r => {
        if ((r[getIndex("규정")] || '').trim() === selectedRule) {
          [7, 11, 15, 19, 23, 31, 35].forEach(idx => {
            const cell = r[idx];
            if (cell) {
              cell.split(",").forEach(val => {
                const trimmed = (val || "").trim();
                if (trimmed) mgmtSet.add(trimmed);
              });
            }
          });
        }
      });

      // 2) 자동완성 소스 교체 (★ 여기서는 '열지' 않음)
      const src = Array.from(mgmtSet);
      $mgmtInput.autocomplete({
        source: src,
        minLength: 0,
        appendTo: "body"
      });

      // 3) 프리필 값 유지/보정 (부분 일치 허용)
      const prev = ($mgmtInput.val() || "").trim();
      let keep = prev && mgmtSet.has(prev);
      if (!keep && prev) {
        const alt = src.find(v => v.includes(prev) || prev.includes(v));
        if (alt) { $mgmtInput.val(alt); keep = true; }
      }
      if (!keep) $mgmtInput.val("");

      // 4) 계약/단가/합계만 초기화
      $table.find(".contract, .price, .total").val("");

      // 5) 값이 있으면 닫고 다음 단계로, 없으면(포커스 중일 때만) 열기
      if ($mgmtInput.val()) {
        $mgmtInput.autocomplete("close");
        $mgmtInput.trigger("change.contract");   // ← 한 번만!
      } else if (document.activeElement === $mgmtInput[0]) {
        $mgmtInput.autocomplete("search", "");
      }
    });

  // 관리유형 변경 시: 각 rental-set 안의 contract input에 autocomplete 설정
  $mgmtInput
    .off("change.contract blur.contract input.contract")
    .on("change.contract blur.contract input.contract", function () {
      const selectedRule = $ruleInput.val()?.trim();
      const mgmtValue = $(this).val()?.trim();
      if (!selectedRule || !mgmtValue) return;

      $table.find(".rental-set").each(function () {
        const $row = $(this);
        const $contractInput = $row.find(".contract");
        const $priceInput = $row.find(".price");
        const $totalInput = $row.find(".total");

        const contractSet = new Set();
        worksheetData.slice(1).forEach(r => {
          if (
            r[getIndex("상품명")] === name &&
            r[getIndex("모델명")] === model &&
            r[getIndex("규정")]?.trim() === selectedRule &&
            [7, 11, 15, 19, 23, 31, 35].some(idx => r[idx]?.includes(mgmtValue))
          ) {

// ✅ [추가] 공용 프리필: item(brand/product/model/rule/mgmt) → 표 1개 채우기
function prefillFromItem($table, item){
  try{
    const brand   = ((item && item.brand)   ? item.brand   : '').trim();
    const product = ((item && item.product) ? item.product : '').trim();
    let   model   = ((item && item.model)   ? item.model   : '').trim();
    const rule    = ((item && item.rule)    ? item.rule    : '').trim();
    const mgmt    = ((item && item.mgmt)    ? item.mgmt    : '').trim();

    if(!product) return;

    // 1) 브랜드 먼저 세팅(브랜드 change 핸들러가 input을 초기화하므로 "먼저" 해야 안전)
    if(brand){
      const $brandSel = $table.find('.brand');
      const $customInput = $table.find('.brand-custom-handler');
      let matched = false;

      $brandSel.find('option').each(function(){
        const t = (this.text || '').trim();
        const v = (this.value || '').trim();
        if (v === brand || t === brand || brand.includes(t) || t.includes(brand)){
          $brandSel.val(v || t).trigger('change');
          matched = true;
          return false;
        }
      });

      if(!matched){
        const canUseCustom = $brandSel.find('option[value="custom"]').length > 0;
        if (canUseCustom) {
          $brandSel.val('custom').trigger('change');
          $customInput.val(brand);
        } else {
          return;
        }
      }
    }

    // 2) 모델명 유추(없으면 시트에서 상품명의 첫 모델)
    if(!model){
      const header = worksheetData[0] || [];
      const nameIdx = header.indexOf("상품명");
      const modelIdx = header.indexOf("모델명");
      const row = (worksheetData.slice(1).find(r => (r[nameIdx]||"") === product)) || null;
      model = row ? (row[modelIdx] || '') : '';
    }

    // 3) 상품명 표시(입력창에는 상품명만)
    $table.find('.product-name').val(product);

    // 4) 내부 연동 채움(모델/색상/용량/사이즈/규정/관리 자동완성 준비)
    if(model){
      fillProductInfo($table, product + '//' + model);
    }

    // 5) 규정/관리유형 선적용 + 종속 트리거
    if (rule) $table.find('.rule').val(rule);

    setTimeout(() => {
      if (rule) $table.find('.rule').trigger('change');

      setTimeout(() => {
        if (mgmt) {
          $table.find('.management').val(mgmt).trigger('change');
        }

        setTimeout(() => {
          if (typeof renderMobileEstimateEditor === "function" && window.innerWidth <= 768) {
            renderMobileEstimateEditor();
          }
        }, 0);
      }, 0);
    }, 0);

  }catch(e){ console.warn('prefillFromItem failed', e); }
}

// 기존: counsel.php에서 넘어온 brand/product/model/rule/mgmt(1개) 자동 프리필
function prefillFromQuery($table){
  try{
    const params = new URLSearchParams(location.search);
    const item = {
      brand: (params.get('brand') || '').trim(),
      product: (params.get('product') || '').trim(),
      model: (params.get('model') || '').trim(),
      rule: (params.get('rule') || '').trim(),
      mgmt: (params.get('mgmt') || '').trim()
    };
    if(!item.product) return;
    prefillFromItem($table, item);
  }catch(e){ console.warn('prefillFromQuery failed', e); }
}

// ✅ [추가] 담기목록(from_cart=1): 담긴 개수만큼 +제품추가 후 프리필
function prefillFromCart(items){
  if (!Array.isArray(items) || items.length === 0) return;

  const $base = $("#productTable");
  prefillFromItem($base, items[0]);

  for (let i = 1; i < items.length; i++) {
    addProduct();

  adjustRentalWidth();
}

});

function waitForCaptureAssets(target) {
  const fontReady = (document.fonts && document.fonts.ready)
    ? document.fonts.ready.catch(() => {})
    : Promise.resolve();

  const imagePromises = Array.from(target.querySelectorAll("img")).map(img => {
    if (img.complete) {
      return Promise.resolve();
    }

    return new Promise(resolve => {
      let done = false;

      const finish = () => {
        if (done) return;
        done = true;
        resolve();
      };

      img.addEventListener("load", finish, { once: true });
      img.addEventListener("error", finish, { once: true });
      setTimeout(finish, 2000);
    });
  });

  return Promise.all([fontReady, ...imagePromises]).then(() => {
    return new Promise(resolve => {
      requestAnimationFrame(() => {
        requestAnimationFrame(resolve);
      });
    });
  });
}

    shareTable.removeAttribute("id");
  }

  const sourceFields = source.querySelectorAll("input, select, textarea");
  const cloneFields = clone.querySelectorAll("input, select, textarea");

  sourceFields.forEach((sourceEl, idx) => {
    const cloneEl = cloneFields[idx];
    if (!cloneEl) return;

    if (sourceEl.type === "checkbox" || sourceEl.type === "radio") {
      cloneEl.checked = sourceEl.checked;
    } else if (sourceEl.type !== "file") {
      cloneEl.value = sourceEl.value;
    }

    if (sourceEl.tagName === "SELECT") {
      cloneEl.value = sourceEl.value;
    }

    if (sourceEl.style.width) {
      cloneEl.style.setProperty("width", sourceEl.style.width, "important");
    }

    if (sourceEl.style.height) {
      cloneEl.style.setProperty("height", sourceEl.style.height, "important");
    }

    if (sourceEl.style.maxWidth) {
      cloneEl.style.setProperty("max-width", sourceEl.style.maxWidth, "important");
    }

    if (sourceEl.style.minWidth) {
      cloneEl.style.setProperty("min-width", sourceEl.style.minWidth, "important");
    }
  });

  clone.querySelectorAll("button").forEach(btn => btn.remove());
  clone.querySelectorAll(".img-upload-input").forEach(input => input.remove());

  clone.querySelectorAll("input, select, textarea").forEach(el => {
    if (el.type === "file") {
      el.remove();
      return;
    }

    el.style.setProperty("border", "none", "important");
    el.style.setProperty("background", "transparent", "important");
    el.style.setProperty("color", "black", "important");
    el.style.setProperty("pointer-events", "none", "important");
    el.style.setProperty("box-shadow", "none", "important");
    el.style.setProperty("outline", "none", "important");

    if (el.tagName === "SELECT") {
      el.style.setProperty("appearance", "none", "important");
      el.style.setProperty("-webkit-appearance", "none", "important");
      el.style.setProperty("-moz-appearance", "none", "important");
      el.style.setProperty("padding-right", "0", "important");
    }
  });

  stage.appendChild(clone);
  document.body.appendChild(stage);

  return { stage, target: clone };
}

function showEstimateLoading(message = "견적서 생성중...") {
  const overlay = document.getElementById("estimateLoadingOverlay");
  const text = document.getElementById("estimateLoadingText");

  if (!overlay) return;

  if (text) {
    text.textContent = message;
  }

  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden", "false");
  document.body.classList.add("estimate-loading-open");
}

function hideEstimateLoading() {
  const overlay = document.getElementById("estimateLoadingOverlay");
  if (!overlay) return;

  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden", "true");
  document.body.classList.remove("estimate-loading-open");
}

function nextEstimateLoadingFrame() {
  return new Promise(resolve => {
    requestAnimationFrame(() => {
      requestAnimationFrame(resolve);
    });
  });
}

function copyEstimateCanvasToClipboard(canvas) {
  return new Promise((resolve, reject) => {
    if (!navigator.clipboard || !window.ClipboardItem) {
      reject(new Error("이미지 클립보드 복사를 지원하지 않는 브라우저입니다."));
      return;
    }

    canvas.toBlob(pngBlob => {
      if (!pngBlob) {
        reject(new Error("클립보드용 이미지 생성에 실패했습니다."));
        return;
      }

      const item = new ClipboardItem({ "image/png": pngBlob });

      navigator.clipboard.write([item])
        .then(resolve)
        .catch(reject);
    }, "image/png");
  });
}

document.getElementById("openSaveModalBtn").addEventListener("click", async function () {
  const customer = document.getElementById("customer").value.trim();
  const estimate_date = document.getElementById("estimate_date").value.trim();
  const manager = document.getElementById("manager").value.trim();
  const contact = document.getElementById("contact").value.trim();

  const firstTable = document.querySelector(".estimate-table");
  const brand = firstTable.querySelector(".brand")?.value.trim();
  const product_name = firstTable.querySelector(".product-name")?.value.trim();

  const missingFields = [];
  if (!brand) missingFields.push("브랜드");
  if (!product_name) missingFields.push("상품명");

  if (missingFields.length > 0) {
    alert(`다음 항목을 입력해주세요:\n\n- ${missingFields.join('\n- ')}`);
    return;
  }

  const optionalMissing = [];
  if (!customer) optionalMissing.push("고객명");
  if (!estimate_date) optionalMissing.push("견적일");
  if (!manager) optionalMissing.push("담당자");
  if (!contact) optionalMissing.push("연락처");

  if (optionalMissing.length > 0) {
    const confirmMsg =
      `"${optionalMissing.join(', ')}" 항목이 입력되지 않았습니다.\n\n진행하시겠습니까?`;

    if (!confirm(confirmMsg)) return;
  }

  const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  showEstimateLoading("견적서 생성중...");
  await nextEstimateLoadingFrame();

  let target = document.querySelector(".card-box");
  let restoreDesktopView = null;
  let cleanupShareCapture = null;

  if (isMobileDevice) {
    const prepared = buildMobileShareCaptureCard();
    if (!prepared || !prepared.target) {
      hideEstimateLoading();
      alert("공유용 견적서 생성 실패");
      return;
    }

    target = prepared.target;
    cleanupShareCapture = function () {
      removeExistingShareCaptureStage();
    };
  } else {
    document.body.classList.add("force-desktop");

    document.querySelectorAll(".card-box button").forEach(btn => btn.style.display = "none");
    document.querySelectorAll(".card-box select, .card-box input, .card-box textarea").forEach(el => {
      el.style.border = "none";
      el.style.background = "transparent";
      el.style.color = "black";
      el.style.pointerEvents = "none";
    });

    restoreDesktopView = function () {
      document.body.classList.remove("force-desktop");
      document.querySelectorAll(".card-box button").forEach(btn => btn.style.display = "");
      document.querySelectorAll(".card-box select, .card-box input, .card-box textarea").forEach(el => {
        el.style.border = "";
        el.style.background = "";
        el.style.color = "";
        el.style.pointerEvents = "";
      });
    };
  }

  const finalizeCapture = function () {
    if (restoreDesktopView) {
      restoreDesktopView();
    }

    if (cleanupShareCapture) {
      cleanupShareCapture();
    }

    if (target) {
      target.style.width = "";
    }

    hideEstimateLoading();
  };

  try {
    const visualWidth = Math.ceil(target.getBoundingClientRect().width);
    const scrollWidth = target.scrollWidth;
    const accurateWidth = Math.max(visualWidth, scrollWidth);
    target.style.width = accurateWidth + "px";

    await waitForCaptureAssets(target);

    window.scrollTo({ left: 0, top: 0 });

    const canvas = await html2canvas(target, {
      scale: 3,
      useCORS: true,
      imageTimeout: 15000,
      backgroundColor: "#ffffff",
      logging: false,
      scrollX: 0,
      scrollY: 0,
      x: 0,
      y: 0,
      width: accurateWidth,
      windowWidth: accurateWidth
    });

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let clipboardReady = false;
    let clipboardErrorMessage = "";

    if (!isMobile) {
      try {
        showEstimateLoading("클립보드 복사중...");
        await nextEstimateLoadingFrame();

        await copyEstimateCanvasToClipboard(canvas);
        clipboardReady = true;
        console.log("✅ 클립보드 복사 성공 (PNG)");
      } catch (copyErr) {
        clipboardErrorMessage = copyErr && copyErr.message ? copyErr.message : String(copyErr || "");
        console.error("❌ 클립보드 복사 실패", copyErr);
      }
    }

    canvas.toBlob(blob => {
      if (!blob) {
        alert("이미지 생성 실패");
        finalizeCapture();
        return;
      }

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const safeCustomer = (customer || "견적서").replace(/\s+/g, '_');
      const filename = `${safeCustomer}_${yyyy}${mm}${dd}_${hh}${mi}${ss}.jpg`;

      const formData = new FormData();
      formData.append("customer_name", customer || "");
      formData.append("estimate_date", estimate_date || "");
      formData.append("supplier", document.getElementById("supplier")?.value || "");
      formData.append("manager", manager || "");
      formData.append("contact", contact || "");
      formData.append("brand", brand);
      formData.append("product_name", product_name);
      formData.append("image", blob, filename);

      const file = new File([blob], filename, { type: "image/jpeg" });

      hideEstimateLoading();

      if (!isMobile && clipboardReady) {
        alert("견적서 이미지가 클립보드에 복사되었습니다.\n확인을 누르면 인쇄 화면이 열립니다.\n인쇄 창을 닫은 뒤 Ctrl+V로 붙여넣기 하시면 됩니다.");
      }

      if (!isMobile && !clipboardReady) {
        const goPrint = confirm("클립보드 복사에 실패했습니다.\n그래도 인쇄 화면을 열까요?");
        if (!goPrint) {
          finalizeCapture();
          return;
        }
      }

      if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          title: '견적서',
          text: `${customer} - ${product_name}`,
          files: [file]
        }).catch(err => {
          if (err.name !== "AbortError") {
            alert("공유 실패: " + err.message);
          }
        });
      } else {
        const dataUrl = URL.createObjectURL(blob);
        const printFrame = document.createElement("iframe");
        printFrame.style.position = "fixed";
        printFrame.style.right = "0";
        printFrame.style.bottom = "0";
        printFrame.style.width = "0";
        printFrame.style.height = "0";
        printFrame.style.border = "0";

        document.body.appendChild(printFrame);

        const doc = printFrame.contentWindow.document;
        doc.open();
        doc.write(`
          <html>
            <head>
              <title>견적서 인쇄</title>
              <style>
                body, html {
                  margin: 0;
                  padding: 0;
                  text-align: center;
                  background: white;
                }
                img {
                  max-width: 100%;
                  height: auto;
                }
              </style>
            </head>
            <body>
              <img src="${dataUrl}">
              <script>
                window.onload = function () {
                  window.print();
                  window.onafterprint = function () {
                    parent.document.body.removeChild(parent.document.querySelector('iframe'));
                  };
                };
              <\/script>
            </body>
          </html>
        `);
        doc.close();
      }

      fetch("save_estimate.php", {
        method: "POST",
        body: formData
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("견적서 저장 성공");
          } else {
            alert("저장 실패: " + data.message);
          }
        })
        .catch(err => {
          alert("에러 발생: " + err.message);
        })
        .finally(() => {
          finalizeCapture();
        });
    }, "image/jpeg", 1.0);
  } catch (err) {
    alert("이미지 생성 실패: " + err.message);
    finalizeCapture();
  }
});

function escapeMobileHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizeCompareText(value) {
  return String(value ?? "").replace(/\s|-/g, "").toLowerCase().trim();
}

function getMobileHeaderIndex(key) {
  if (!Array.isArray(worksheetData) || !Array.isArray(worksheetData[0])) return -1;
  return worksheetData[0].indexOf(key);
}

function getDesktopEstimateTables() {
  return Array.from(document.querySelectorAll("#estimateDesktopShell #productContainer .estimate-table"));
}

function getTableBrandSelectValue(table) {
  const brandSelect = table.querySelector(".brand");
  return (brandSelect?.value || "").trim();
}

function getProductOptionsForBrand(brandValue) {
  const brandIdx = getMobileHeaderIndex("브랜드");
  const nameIdx = getMobileHeaderIndex("상품명");
  const modelIdx = getMobileHeaderIndex("모델명");
  const map = new Map();

  if (brandIdx === -1 || nameIdx === -1 || modelIdx === -1) return [];

  worksheetData.slice(1).forEach(row => {
    const brand = (row[brandIdx] || "").trim();
    const name = (row[nameIdx] || "").trim();
    const model = (row[modelIdx] || "").trim();

    if (!name) return;
    if (brandValue && brandValue !== "custom" && brand !== brandValue) return;

    const productValue = `${name}//${model}`;
    if (!map.has(productValue)) {
      map.set(productValue, {
        label: model ? `${name} / ${model}` : name,
        value: name,
        productValue: productValue
      });
    }
  });

  return Array.from(map.values());
}

function getMatchedRowsForTable(table) {
  const nameIdx = getMobileHeaderIndex("상품명");
  const modelIdx = getMobileHeaderIndex("모델명");

  if (nameIdx === -1 || modelIdx === -1) return [];

  const productName = (table.querySelector(".product-name")?.value || "").trim();
  const modelName = (table.querySelector(".model")?.value || "").trim();

  if (!productName || !modelName) return [];

  return worksheetData.slice(1).filter(row => {
    return ((row[nameIdx] || "").trim() === productName) &&
           ((row[modelIdx] || "").trim() === modelName);
  });
}

function getRuleOptionsForTable(table) {
  const ruleIdx = getMobileHeaderIndex("규정");
  const matchedRows = getMatchedRowsForTable(table);
  const set = new Set();

  if (ruleIdx === -1) return [];

  matchedRows.forEach(row => {
    const rule = (row[ruleIdx] || "").trim();
    if (rule) set.add(rule);
  });

  return Array.from(set);
}

function getManagementOptionsForTable(table) {
  const ruleIdx = getMobileHeaderIndex("규정");
  const selectedRule = (table.querySelector(".rule")?.value || "").trim();
  const matchedRows = getMatchedRowsForTable(table);
  const set = new Set();

  matchedRows.forEach(row => {
    if (!selectedRule || ((row[ruleIdx] || "").trim() === selectedRule)) {
      [7, 11, 15, 19, 23, 31, 35].forEach(idx => {
        const cell = row[idx];
        if (cell) {
          cell.split(",").forEach(val => {
            const trimmed = (val || "").trim();
            if (trimmed) set.add(trimmed);
          });
        }
      });
    }
  });

  return Array.from(set);
}

function getContractOptionsForTable(table) {
  const ruleIdx = getMobileHeaderIndex("규정");
  const selectedRule = (table.querySelector(".rule")?.value || "").trim();
  const mgmtValue = (table.querySelector(".management")?.value || "").trim();
  const matchedRows = getMatchedRowsForTable(table);
  const set = new Set();

  matchedRows.forEach(row => {
    if (!selectedRule || !mgmtValue) return;
    if ((row[ruleIdx] || "").trim() !== selectedRule) return;

    const mgmtMatched = [7, 11, 15, 19, 23, 31, 35].some(idx => {
      const values = (row[idx] || "").split(",").map(v => v.trim());
      return values.includes(mgmtValue);
    });

    if (!mgmtMatched) return;

    [6, 10, 14, 18, 22, 30, 34].forEach(idx => {
      const cell = row[idx];
      if (cell) {
        cell.split(",").forEach(val => {
          const trimmed = (val || "").trim();
          if (trimmed) set.add(trimmed);
        });
      }
    });
  });

  return Array.from(set);
}

function getPriceOptionsForTable(table, selectedContract) {
  const ruleIdx = getMobileHeaderIndex("규정");
  const selectedRule = (table.querySelector(".rule")?.value || "").trim();
  const mgmtValue = (table.querySelector(".management")?.value || "").trim();
  const matchedRows = getMatchedRowsForTable(table);
  const set = new Set();

  matchedRows.forEach(row => {
    if (!selectedRule || !mgmtValue || !selectedContract) return;
    if ((row[ruleIdx] || "").trim() !== selectedRule) return;

    const mgmtMatched = [7, 11, 15, 19, 23, 31, 35].some(idx => {
      const values = (row[idx] || "").split(",").map(v => v.trim());
      return values.includes(mgmtValue);
    });

    if (!mgmtMatched) return;

    const contractCols = [6, 10, 14, 18, 22, 30, 34];
    const priceCols = [8, 12, 16, 20, 24, 32, 36];

    for (let i = 0; i < contractCols.length; i++) {
      const contractCell = row[contractCols[i]];
      const priceCell = row[priceCols[i]];

      if (!contractCell || !priceCell) continue;

      const contracts = contractCell.split(",").map(v => v.trim());
      if (contracts.includes(selectedContract) && priceCell.trim()) {
        set.add(priceCell.trim());
      }
    }
  });

  return Array.from(set);
}

function setOriginalFieldValue(element, value) {
  if (!element) return;

  element.value = value;
  element.dispatchEvent(new Event("input", { bubbles: true }));
  element.dispatchEvent(new Event("change", { bubbles: true }));
}

function buildMobileBrandOptionsHtml(table) {
  const brandSelect = table.querySelector(".brand");
  if (!brandSelect) return `<option value="">브랜드 선택</option>`;

  return Array.from(brandSelect.options).map(opt => {
    const value = opt.value || "";
    const label = opt.textContent || "";
    const selected = value === brandSelect.value ? " selected" : "";
    return `<option value="${escapeMobileHtml(value)}"${selected}>${escapeMobileHtml(label)}</option>`;
  }).join("");
}

function getTableByIndex(tableIndex) {
  return getDesktopEstimateTables()[tableIndex] || null;
}

function syncMobileFieldBySelector(tableIndex, selector, value, shouldRender) {
  const table = getTableByIndex(tableIndex);
  if (!table) return;

  setOriginalFieldValue(table.querySelector(selector), value);

  if (shouldRender) {
    setTimeout(() => {
      renderMobileEstimateEditor();
    }, 0);
  }
}

function syncMobileRentalFieldBySelector(tableIndex, rentalIndex, selector, value, shouldRender) {
  const table = getTableByIndex(tableIndex);
  if (!table) return;

  const row = table.querySelectorAll(".rental-set")[rentalIndex];
  if (!row) return;

  setOriginalFieldValue(row.querySelector(selector), value);

  if (shouldRender) {
    setTimeout(() => {
      renderMobileEstimateEditor();
    }, 0);
  }
}

function syncMobileRentalTotalsFromDesktop(tableIndex) {
  const table = getTableByIndex(tableIndex);
  if (!table) return;

  const mobileCard = document.querySelector('.mobile-product-card[data-table-index="' + tableIndex + '"]');
  if (!mobileCard) return;

  const desktopRows = table.querySelectorAll(".rental-set");
  const mobileRows = mobileCard.querySelectorAll(".mobile-rental-row");

  desktopRows.forEach((desktopRow, idx) => {
    const totalValue = desktopRow.querySelector(".total")?.value || "";
    const mobileTotalInput = mobileRows[idx]?.querySelector('input[readonly]');
    if (mobileTotalInput) {
      mobileTotalInput.value = totalValue;
    }
  });
}

function attachMobileAutocompleteInput(inputEl, sourceFactory, onSelect) {
  const $input = $(inputEl);

  if ($input.data("uiAutocomplete")) {
    $input.autocomplete("destroy");
  }

  $input.autocomplete({
    source: function (request, response) {
      const term = String(request.term || "").toLowerCase().replace(/\s|-/g, '');

      const list = (sourceFactory() || [])
        .map(item => typeof item === "string" ? { label: item, value: item } : item)
        .filter(item => {
          if (!term) return true;

          const haystack = [
            item.label || "",
            item.value || "",
            item.productValue || ""
          ].join(" ").toLowerCase().replace(/\s|-/g, '');

          return haystack.includes(term);
        });

      response(list);
    },
    minLength: 0,
    appendTo: "body",
    focus: function (event, ui) {
      event.preventDefault();
      $input.val(ui.item.value || ui.item.label || "");
    },
    select: function (event, ui) {
      event.preventDefault();
      onSelect(ui.item);
    }
  });

  $input.off("focus.mobileAuto").on("focus.mobileAuto", function () {
    $input.autocomplete("search", $input.val() || "");
  });
}

function syncMobileProductInput(inputEl, shouldRender) {
  const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
  const table = getTableByIndex(tableIndex);
  if (!table) return;

  const rawValue = (inputEl.value || "").trim();
  const desktopProductInput = table.querySelector(".product-name");

  if (!desktopProductInput) return;

  const brandValue = getTableBrandSelectValue(table);
  const productOptions = getProductOptionsForBrand(brandValue === "custom" ? "" : brandValue);
  const normalizedRaw = normalizeCompareText(rawValue);

  const matched = productOptions.find(opt => {
    return normalizeCompareText(opt.label) === normalizedRaw ||
           normalizeCompareText(opt.value) === normalizedRaw ||
           normalizeCompareText(String(opt.productValue || "").split("//")[0]) === normalizedRaw;
  });

  if (!rawValue) {
    setOriginalFieldValue(desktopProductInput, "");
    [".model", ".color", ".volume", ".size", ".rule", ".management"].forEach(selector => {
      const el = table.querySelector(selector);
      if (el) el.value = "";
    });
    table.querySelectorAll(".contract, .price, .total").forEach(el => {
      el.value = "";
    });
    table.querySelector(".product-img")?.setAttribute("src", "?image=e_no_image");
  } else if (matched && matched.productValue) {
    desktopProductInput.value = matched.value || "";
    fillProductInfo($(table), matched.productValue);
  } else {
    setOriginalFieldValue(desktopProductInput, rawValue);
    [".model", ".color", ".volume", ".size", ".rule", ".management"].forEach(selector => {
      const el = table.querySelector(selector);
      if (el) el.value = "";
    });
    table.querySelectorAll(".contract, .price, .total").forEach(el => {
      el.value = "";
    });
    table.querySelector(".product-img")?.setAttribute("src", "?image=e_no_image");
  }

  if (shouldRender) {
    setTimeout(() => {
      renderMobileEstimateEditor();
    }, 0);
  }
}

function bindMobileAutocompleteInputs() {
  if (window.innerWidth > 768) return;

  document.querySelectorAll(".m-product-input").forEach(function (inputEl) {
    attachMobileAutocompleteInput(
      inputEl,
      function () {
        const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
        const table = getTableByIndex(tableIndex);
        if (!table) return [];

        const brandValue = getTableBrandSelectValue(table);
        return getProductOptionsForBrand(brandValue === "custom" ? "" : brandValue);
      },
      function (item) {
        const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
        const table = getTableByIndex(tableIndex);
        if (!table) return;

        inputEl.value = item.value || "";
        table.querySelector(".product-name").value = item.value || "";

        if (item.productValue) {
          fillProductInfo($(table), item.productValue);
        }

        setTimeout(() => {
          renderMobileEstimateEditor();
        }, 0);
      }
    );
  });

  document.querySelectorAll(".m-rule-input").forEach(function (inputEl) {
    attachMobileAutocompleteInput(
      inputEl,
      function () {
        const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
        const table = getTableByIndex(tableIndex);
        return table ? getRuleOptionsForTable(table) : [];
      },
      function (item) {
        inputEl.value = item.value || item.label || "";
        syncMobileFieldBySelector(
          parseInt(inputEl.dataset.tableIndex || "-1", 10),
          ".rule",
          inputEl.value,
          true
        );
      }
    );
  });

  document.querySelectorAll(".m-management-input").forEach(function (inputEl) {
    attachMobileAutocompleteInput(
      inputEl,
      function () {
        const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
        const table = getTableByIndex(tableIndex);
        return table ? getManagementOptionsForTable(table) : [];
      },
      function (item) {
        inputEl.value = item.value || item.label || "";
        syncMobileFieldBySelector(
          parseInt(inputEl.dataset.tableIndex || "-1", 10),
          ".management",
          inputEl.value,
          true
        );
      }
    );
  });

  document.querySelectorAll(".m-contract-input").forEach(function (inputEl) {
    attachMobileAutocompleteInput(
      inputEl,
      function () {
        const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
        const table = getTableByIndex(tableIndex);
        return table ? getContractOptionsForTable(table) : [];
      },
      function (item) {
        inputEl.value = item.value || item.label || "";
        syncMobileRentalFieldBySelector(
          parseInt(inputEl.dataset.tableIndex || "-1", 10),
          parseInt(inputEl.dataset.rentalIndex || "-1", 10),
          ".contract",
          inputEl.value,
          true
        );
      }
    );
  });

  document.querySelectorAll(".m-price-input").forEach(function (inputEl) {
    attachMobileAutocompleteInput(
      inputEl,
      function () {
        const tableIndex = parseInt(inputEl.dataset.tableIndex || "-1", 10);
        const rentalIndex = parseInt(inputEl.dataset.rentalIndex || "-1", 10);
        const table = getTableByIndex(tableIndex);
        if (!table) return [];

        const row = table.querySelectorAll(".rental-set")[rentalIndex];
        const selectedContract = (row?.querySelector(".contract")?.value || "").trim();

        return getPriceOptionsForTable(table, selectedContract);
      },
      function (item) {
        inputEl.value = item.value || item.label || "";
        syncMobileRentalFieldBySelector(
          parseInt(inputEl.dataset.tableIndex || "-1", 10),
          parseInt(inputEl.dataset.rentalIndex || "-1", 10),
          ".price",
          inputEl.value,
          true
        );
      }
    );
  });
}

function renderMobileEstimateEditor() {
  const mobileShell = document.getElementById("mobileEstimateShell");
  const productCards = document.getElementById("mobileProductCards");

  if (!mobileShell || !productCards) return;
  if (window.innerWidth > 768) return;

  const topFieldIds = ["customer", "supplier", "estimate_date", "manager", "valid_date", "contact"];
  topFieldIds.forEach(id => {
    const source = document.getElementById(id);
    const mobile = document.getElementById("m_" + id);
    if (!source || !mobile) return;
    if (document.activeElement !== mobile) {
      mobile.value = source.value || "";
    }
  });

  const tables = getDesktopEstimateTables();
  productCards.innerHTML = tables.map((table, idx) => buildMobileProductCardHtml(table, idx)).join("");
  bindMobileAutocompleteInputs();

  requestAnimationFrame(() => {
    updateEstimateMobileActionLayout();
  });
}

function initMobileEstimateEditor() {
  const mobileShell = document.getElementById("mobileEstimateShell");
  if (!mobileShell) return;

  if (mobileShell.dataset.bound === "1") {
    renderMobileEstimateEditor();
    return;
  }

  mobileShell.dataset.bound = "1";

  ["customer", "supplier", "estimate_date", "manager", "valid_date", "contact"].forEach(id => {
    const mobileInput = document.getElementById("m_" + id);
    const desktopInput = document.getElementById(id);

    if (!mobileInput || !desktopInput) return;

    mobileInput.addEventListener("input", function () {
      desktopInput.value = mobileInput.value;
      desktopInput.dispatchEvent(new Event("input", { bubbles: true }));

      if (id === "contact") {
        setTimeout(() => {
          mobileInput.value = desktopInput.value || "";
        }, 0);
      }
    });

    mobileInput.addEventListener("change", function () {
      desktopInput.value = mobileInput.value;
      desktopInput.dispatchEvent(new Event("change", { bubbles: true }));
    });
  });

  mobileShell.addEventListener("click", function (e) {
    const addBtn = e.target.closest("#mAddProductBtn");
    if (addBtn) {
      addProduct();
      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
      return;
    }

    const resetBtn = e.target.closest("#mResetBtn");
    if (resetBtn) {
      resetProductsArea();
      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
      return;
    }

    const listBtn = e.target.closest("#mOpenListBtn");
    if (listBtn) {
      document.getElementById("openListBtn")?.click();
      return;
    }

    const shareBtn = e.target.closest("#mShareBtn");
    if (shareBtn) {
      document.getElementById("openSaveModalBtn")?.click();
      return;
    }

    const deleteProductBtn = e.target.closest(".m-delete-product-btn");
    if (deleteProductBtn) {
      const tableIndex = parseInt(deleteProductBtn.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      table?.querySelector(".delete-btn")?.click();
      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
      return;
    }

    const addRentalBtn = e.target.closest(".m-add-rental-row-btn");
    if (addRentalBtn) {
      const tableIndex = parseInt(addRentalBtn.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      table?.querySelector(".add-rental-set")?.click();
      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
      return;
    }

    const removeRentalBtn = e.target.closest(".m-remove-rental-row-btn");
    if (removeRentalBtn) {
      const tableIndex = parseInt(removeRentalBtn.dataset.tableIndex || "-1", 10);
      const rentalIndex = parseInt(removeRentalBtn.dataset.rentalIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      const row = table?.querySelectorAll(".rental-set")[rentalIndex];
      row?.querySelector(".remove-rental-set")?.click();
      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
      return;
    }

    const changeImageBtn = e.target.closest(".m-change-image-btn");
    if (changeImageBtn) {
      const tableIndex = parseInt(changeImageBtn.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      table?.querySelector(".img-upload-input")?.click();
      return;
    }
  });

  mobileShell.addEventListener("change", function (e) {
    const brandSelect = e.target.closest(".m-brand-select");
    if (brandSelect) {
      const tableIndex = parseInt(brandSelect.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      if (!table) return;

      const originalSelect = table.querySelector(".brand");
      const originalCustom = table.querySelector(".brand-custom-handler");

      if (originalSelect) {
        originalSelect.classList.remove("d-none");
        originalSelect.value = brandSelect.value;
        originalSelect.dispatchEvent(new Event("change", { bubbles: true }));
      }

      if (originalCustom) {
        if (brandSelect.value === "custom") {
          originalSelect?.classList.add("d-none");
          originalCustom.classList.remove("d-none");
        } else {
          originalCustom.classList.add("d-none");
          originalCustom.value = "";
        }
      }

      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
      return;
    }

    const productInput = e.target.closest(".m-product-input");
    if (productInput) {
      syncMobileProductInput(productInput, true);
      return;
    }

    const ruleInput = e.target.closest(".m-rule-input");
    if (ruleInput) {
      syncMobileFieldBySelector(
        parseInt(ruleInput.dataset.tableIndex || "-1", 10),
        ".rule",
        ruleInput.value || "",
        true
      );
      return;
    }

    const managementInput = e.target.closest(".m-management-input");
    if (managementInput) {
      syncMobileFieldBySelector(
        parseInt(managementInput.dataset.tableIndex || "-1", 10),
        ".management",
        managementInput.value || "",
        true
      );
      return;
    }

    const contractInput = e.target.closest(".m-contract-input");
    if (contractInput) {
      syncMobileRentalFieldBySelector(
        parseInt(contractInput.dataset.tableIndex || "-1", 10),
        parseInt(contractInput.dataset.rentalIndex || "-1", 10),
        ".contract",
        contractInput.value || "",
        true
      );
      return;
    }

    const priceInput = e.target.closest(".m-price-input");
    if (priceInput) {
      syncMobileRentalFieldBySelector(
        parseInt(priceInput.dataset.tableIndex || "-1", 10),
        parseInt(priceInput.dataset.rentalIndex || "-1", 10),
        ".price",
        priceInput.value || "",
        true
      );
      return;
    }
  });

  mobileShell.addEventListener("input", function (e) {
    const brandCustomInput = e.target.closest(".m-brand-custom");
    if (brandCustomInput) {
      const tableIndex = parseInt(brandCustomInput.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      if (!table) return;

      const originalSelect = table.querySelector(".brand");
      const originalCustom = table.querySelector(".brand-custom-handler");

      if (originalSelect) {
        originalSelect.value = "custom";
        originalSelect.classList.add("d-none");
        originalSelect.dispatchEvent(new Event("change", { bubbles: true }));
      }

      if (originalCustom) {
        originalCustom.classList.remove("d-none");
        originalCustom.value = brandCustomInput.value;
      }
      return;
    }

    const qtyInput = e.target.closest(".m-qty-input");
    if (qtyInput) {
      const tableIndex = parseInt(qtyInput.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      const rawValue = qtyInput.value || "";
      const normalizedValue = rawValue === "" ? "" : rawValue;

      setOriginalFieldValue(table?.querySelector(".qty"), normalizedValue);

      setTimeout(() => {
        syncMobileRentalTotalsFromDesktop(tableIndex);
      }, 0);
      return;
    }

    const noteInput = e.target.closest(".m-note-input");
    if (noteInput) {
      const tableIndex = parseInt(noteInput.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      setOriginalFieldValue(table?.querySelector(".note"), noteInput.value || "");
      return;
    }

    const directInput = e.target.closest(".m-direct-sync");
    if (directInput) {
      const tableIndex = parseInt(directInput.dataset.tableIndex || "-1", 10);
      const table = getDesktopEstimateTables()[tableIndex];
      const selector = directInput.dataset.selector || "";
      setOriginalFieldValue(table?.querySelector(selector), directInput.value || "");
      return;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.matches(".img-upload-input")) {
      setTimeout(() => {
        renderMobileEstimateEditor();
      }, 0);
    }
  });

  let wasMobileEditorView = window.innerWidth <= 768;

  window.addEventListener("resize", function () {
    const isMobileEditorView = window.innerWidth <= 768;

    if (isMobileEditorView !== wasMobileEditorView) {
      wasMobileEditorView = isMobileEditorView;

      if (isMobileEditorView) {
        renderMobileEstimateEditor();
      }
    } else {
      wasMobileEditorView = isMobileEditorView;
    }
  });

  renderMobileEstimateEditor();
}

function updateEstimateMobileActionLayout() {
  const isMobileView = window.innerWidth <= 768;
  const root = document.documentElement;
  const actionBox = document.querySelector("#mobileEstimateShell .main-action-box");

  if (!isMobileView) {
    document.body.classList.remove("mobile-fixed-actionbar");
    root.style.setProperty("--estimate-mobile-action-height", "0px");
    root.style.setProperty("--estimate-mobile-bottom-offset", "0px");
    return;
  }

  document.body.classList.add("mobile-fixed-actionbar");

  let actionHeight = 0;
  if (actionBox) {
    actionHeight = Math.ceil(actionBox.getBoundingClientRect().height);
  }

  let viewportBottomOffset = 0;
  if (window.visualViewport) {
    const vv = window.visualViewport;
    viewportBottomOffset = Math.max(
      0,
      Math.round(window.innerHeight - (vv.height + vv.offsetTop))
    );
  }

  root.style.setProperty("--estimate-mobile-action-height", `${actionHeight}px`);
  root.style.setProperty("--estimate-mobile-bottom-offset", `${viewportBottomOffset}px`);
}

window.addEventListener("DOMContentLoaded", () => {
  const runEstimateMobileLayout = () => {
    updateEstimateMobileActionLayout();
  };

  initMobileEstimateEditor();

  setTimeout(runEstimateMobileLayout, 0);
  requestAnimationFrame(runEstimateMobileLayout);

  window.addEventListener("resize", runEstimateMobileLayout);
  window.addEventListener("orientationchange", runEstimateMobileLayout);

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", runEstimateMobileLayout);
    window.visualViewport.addEventListener("scroll", runEstimateMobileLayout);
  }
});

document.addEventListener("DOMContentLoaded", () => {
  const isMobile = window.innerWidth <= 768;

  const openSaveBtn = document.getElementById("openSaveModalBtn");
  const openSaveBtnLabel = document.getElementById("openSaveModalBtnLabel");
  const openSaveBtnIcon = document.getElementById("openSaveModalBtnIcon");

  if (openSaveBtn && openSaveBtnLabel) {
    openSaveBtnLabel.textContent = isMobile
      ? (openSaveBtn.dataset.mobileLabel || "공유/저장")
      : (openSaveBtn.dataset.pcLabel || "인쇄/저장");
  }

  if (openSaveBtnIcon) {
    openSaveBtnIcon.src = isMobile
      ? "./assets/webimage/button/shar.png"
      : "./assets/webimage/button/save.png";
  }

  const openListBtn = document.getElementById("openListBtn");
  if (openListBtn) {
    openListBtn.addEventListener("click", () => {
      loadEstimateList(1);

      const modalEl = document.getElementById("estimateListModal");
      if (modalEl) {
        new bootstrap.Modal(modalEl).show();
      }
    });
  }

  const estimateFilterForm = document.getElementById("estimateFilterForm");
  if (estimateFilterForm) {
    estimateFilterForm.addEventListener("submit", function (e) {
      e.preventDefault();
      loadEstimateList(1);
    });
  }

  (function bindEstimateJumpOnce() {
    const jumpForm = document.getElementById("estimateJumpForm");
    const jumpInput = document.getElementById("estimateJumpInput");

    if (!jumpForm || !jumpInput) return;
    if (jumpForm.dataset.bound === "1") return;
    jumpForm.dataset.bound = "1";

    jumpForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const totalPages = parseInt(jumpForm.dataset.totalPages || "1", 10) || 1;
      let p = parseInt((jumpInput.value || "").trim(), 10);

      if (!p || p < 1) p = 1;
      if (p > totalPages) p = totalPages;

      if (typeof window.__estimatePagerGoto === "function") {
        window.__estimatePagerGoto(p);
      }
    });
  })();
});

function loadEstimateList(page = 1) {
  const form = document.getElementById("estimateFilterForm");
  const params = new URLSearchParams(new FormData(form));
  params.append("page", page);

  fetch("fetch_estimate_list.php?" + params.toString())
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById("estimateListBody");
      const cards = document.getElementById("estimateListCards");
      const pagination = document.getElementById("estimatePagination");

      const esc = (value) => {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      };

      if (tbody) tbody.innerHTML = "";
      if (cards) cards.innerHTML = "";

      if (!data.success || !data.rows.length) {
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">결과가 없습니다</td></tr>`;
        }
        if (cards) {
          cards.innerHTML = `<div class="text-center text-muted py-3">결과가 없습니다</div>`;
        }
        if (pagination) {
          pagination.innerHTML = "";
        }
        return;
      }

      data.rows.forEach(row => {
        const safeFilename = encodeURIComponent(String(row.filename || ""));
        const safeId = encodeURIComponent(String(row.id || ""));

        if (tbody) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="text-center">${esc(row.estimate_date)}</td>

}

function renderEstimatePagination({ total, current, onGoto }) {
  const ul = document.getElementById("estimatePagination");
  const jumpForm = document.getElementById("estimateJumpForm");
  const jumpInput = document.getElementById("estimateJumpInput");
  const statusEl = document.getElementById("estimatePageStatus");

  if (!ul) return;

  ul.innerHTML = "";

  const totalPages = parseInt(total || "0", 10) || 0;
  let currentPage = parseInt(current || "1", 10) || 1;

  if (totalPages <= 1) {
    if (jumpForm) jumpForm.style.display = "none";
    if (statusEl) statusEl.textContent = "1 / 1";
    return;
  }

  if (currentPage < 1) currentPage = 1;
  if (currentPage > totalPages) currentPage = totalPages;

  // ✅ 모바일에서는 숫자 범위를 더 줄여서 가로폭 최소화
  const isMobile = window.innerWidth <= 768;
  const around = isMobile ? 1 : 2;

  // ✅ 점프 폼 상태 업데이트
  if (jumpForm) {
    jumpForm.style.display = "flex";
    jumpForm.dataset.totalPages = String(totalPages);
    jumpForm.dataset.currentPage = String(currentPage);
  }
  if (statusEl) statusEl.textContent = `${currentPage} / ${totalPages}`;
  if (jumpInput) {
    jumpInput.min = "1";
    jumpInput.max = String(totalPages);
    jumpInput.value = "";
  }

  const addBtn = (label, page, { disabled = false, active = false } = {}) => {
    const li = document.createElement("li");
    li.className = "page-item" + (disabled ? " disabled" : "") + (active ? " active" : "");

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "page-link";
    btn.textContent = label;

    if (!disabled && !active) {
      btn.addEventListener("click", () => onGoto(page));
    }

    li.appendChild(btn);
    ul.appendChild(li);
  };

  const addDots = () => {
    const li = document.createElement("li");
    li.className = "page-item disabled";
    li.innerHTML = `<span class="page-link">…</span>`;
    ul.appendChild(li);
  };

  // « 맨앞 / ‹ 이전
  addBtn("«", 1, { disabled: currentPage === 1 });
  addBtn("‹", Math.max(1, currentPage - 1), { disabled: currentPage === 1 });

  // 숫자 구간
  let start = Math.max(1, currentPage - around);
  let end = Math.min(totalPages, currentPage + around);

  // 1페이지 고정 + …
  if (start > 1) {
    addBtn("1", 1, { active: currentPage === 1 });
    if (start > 2) addDots();
  }

  for (let p = start; p <= end; p++) {
    addBtn(String(p), p, { active: p === currentPage });
  }

  // 마지막 페이지 고정 + …
  if (end < totalPages) {
    if (end < totalPages - 1) addDots();
    addBtn(String(totalPages), totalPages, { active: currentPage === totalPages });
  }

  // › 다음 / » 맨뒤
  addBtn("›", Math.min(totalPages, currentPage + 1), { disabled: currentPage === totalPages });
  addBtn("»", totalPages, { disabled: currentPage === totalPages });

  // ✅ 점프 submit이 onGoto를 쓸 수 있게 저장
  window.__estimatePagerGoto = onGoto;
}

function downloadEstimate(filename) {
  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    // ✅ 공유 동작
    const url = "/estimates/" + encodeURIComponent(filename);
    fetch(url)
      .then(res => res.blob())
      .then(blob => {
        const file = new File([blob], filename, { type: "image/jpeg" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            title: "견적서",
            text: "공유된 견적서입니다.",
            files: [file]
          }).catch(err => {
            if (err.name !== "AbortError") {
              alert("❌ 공유 실패: " + err.message);
            }
          });
        } else {
          alert("❌ 이 브라우저는 공유를 지원하지 않습니다.");
        }
      })
      .catch(err => {
        alert("❌ 파일 불러오기 실패: " + err.message);
      });
  } else {
    // ✅ 기존 다운로드
    const link = document.createElement("a");
    link.href = "/estimates/" + encodeURIComponent(filename);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
}

function deleteEstimate(id) {
  if (!confirm("정말 삭제하시겠습니까?")) return;
  
  fetch("delete_estimate.php", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "id=" + encodeURIComponent(id)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("삭제 완료");
      loadEstimateList();
    } else {
      alert("삭제 실패: " + data.message);
    }
  })
  .catch(err => alert("삭제 중 오류 발생: " + err.message));
}

// ✅ 제품 영역만 초기화 (상단 고객/공급자/담당자/연락처/견적일은 그대로 유지)
function resetProductsArea() {
  if (!confirm("견적서를 초기화하시겠습니까?")) return;

  const container = document.getElementById("productContainer");

  // 1) 첫 번째 테이블(#productTable)만 남기고 나머지 제거
  container.querySelectorAll(".estimate-table").forEach(tbl => {
    if (tbl.id !== "productTable") tbl.remove();
  });

  // 2) 기본 테이블의 모든 제품 관련 필드 초기화
  const base = document.getElementById("productTable");
  if (!base) return;

  // 브랜드/직접입력
  $(base).find(".brand").val("");
  $(base).find(".brand-custom-handler").addClass("d-none").val("");

  // 상품/모델/규정/관리/색상/용량/사이즈
  $(base).find(".product-name, .model, .color, .volume, .size, .rule, .management").val("");

  // 수량/특이사항
  $(base).find(".qty").val("1");
  $(base).find(".note").val("설치비 면제 / 등록비 면제");

  // 이미지
  $(base).find(".product-img").attr("src", "?image=e_no_image");

  // 렌탈 입력(첫 행만 남기고 값 초기화)
  const $rb = $(base).find(".rental-body");
  $rb.find(".rental-set").not(":first").remove();
  $rb.find(".contract, .price, .total").val("");

  // 3) 자동완성·합계·레이아웃 재정렬
  const $base = $("#productTable");
  initializeAutocompleteFor($base);  // 상품 자동완성 재바인딩
  updateTotal($base);                // 합계 리셋
  updateProductLayoutClass();        // two-or-less / three-or-more 토글
  adjustCardBoxWidth();              // 카드 폭 재계산
  adjustRentalWidth();               // 렌탈 칼럼 폭 재계산

  // UX: 첫 입력 포커스
  base.querySelector(".product-name")?.focus();
}

// ✅ 초기화 버튼 이벤트 바인딩
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("resetBtn")?.addEventListener("click", resetProductsArea);
});
</script>
