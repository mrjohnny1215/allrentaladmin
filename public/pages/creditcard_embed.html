<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제휴카드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; }
  img { max-width: 100%; height: auto; display: block; }
  .fallback-msg { color: #888; font-size: 14px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <img id="cardImg" alt="제휴카드" onerror="handleErr()">
</div>
<script>
  // 🔹 Vercel 정적 호스팅용: creditcard_embed.php 대체본
  //   URL: creditcard_embed.html?key=cwcard
  //   → public/assets/card/<key>.png 를 표시 (없으면 1cwcard.png 폴백)
  (function () {
    const params = new URLSearchParams(location.search);
    const key = (params.get('key') || 'cwcard').trim();
    const img = document.getElementById('cardImg');
    const candidates = [
      '../assets/card/' + key + '.png',
      'assets/card/' + key + '.png',
      '../assets/card/1cwcard.png',
      'assets/card/1cwcard.png'
    ];
    let idx = 0;
    function tryNext() {
      if (idx >= candidates.length) {
        img.style.display = 'none';
        const p = document.createElement('div');
        p.className = 'fallback-msg';
        p.textContent = '해당 브랜드의 제휴카드 이미지가 준비 중입니다.';
        img.parentNode.appendChild(p);
        return;
      }
      img.src = candidates[idx++];
    }
    img.onerror = tryNext;
    tryNext();
  })();
</script>
</body>
</html>
