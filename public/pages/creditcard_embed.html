<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제휴카드 안내</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
  .title { font-size: 18px; font-weight: 700; }
  .close-btn { width: 36px; height: 36px; border: none; background: none; font-size: 22px; cursor: pointer; color: #666; display: flex; align-items: center; justify-content: center; }
  .close-btn:hover { color: #000; }
  .body { flex: 1; overflow-y: auto; padding: 16px; display: flex; align-items: center; justify-content: center; background: #f8f8f8; }
  .body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .fallback { color: #888; font-size: 14px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">💳 제휴카드 안내</div>
    <button class="close-btn" onclick="closeParent()" aria-label="닫기">✕</button>
  </div>
  <div class="body" id="imgWrap">
    <div class="fallback">해당 브랜드의 제휴카드 이미지가 준비 중입니다.</div>
  </div>
</div>
<script>
  const BRAND_IMG = {
    cwcard: 'cards/coway.png',
    chcard: 'cards/chungho.png',
    skcard: 'cards/sk.png',
    cccard: 'cards/cuckoo.png',
    wscard: 'cards/wells.png',
    lgcard: 'cards/lg.png',
    hdcard: 'cards/hyundai.png',
    cescard: 'cards/sesko.png'
  };

  function closeParent() {
    if (window.parent && typeof window.parent.closeCardOverlay === 'function') {
      window.parent.closeCardOverlay();
    } else {
      window.close();
    }
  }

  (function () {
    const params = new URLSearchParams(location.search);
    const key = (params.get('key') || '').trim();
    const wrap = document.getElementById('imgWrap');
    if (!wrap) return;

    const src = BRAND_IMG[key];
    if (!src) {
      wrap.innerHTML = '<div class="fallback">해당 브랜드의 제휴카드 이미지가 준비 중입니다.</div>';
      return;
    }

    const img = new Image();
    img.src = src;
    img.alt = '제휴카드 안내';
    img.onerror = function () {
      wrap.innerHTML = '<div class="fallback">이미지를 불러오지 못했습니다.</div>';
    };
    wrap.innerHTML = '';
    wrap.appendChild(img);
  })();
</script>
</body>
</html>
