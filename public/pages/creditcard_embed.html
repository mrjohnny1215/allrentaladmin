<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제휴카드 안내</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  .modal-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #f0f0f0; }
  .modal-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .modal-close { width: 32px; height: 32px; border: none; background: none; font-size: 20px; cursor: pointer; color: #999; }
  .modal-close:hover { color: #333; }
  .modal-body { flex: 1; overflow-y: auto; padding: 16px; }
  .card-item { background: #f3f0ff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card-item:last-child { margin-bottom: 0; }
  .card-row { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon { width: 48px; height: 48px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .card-img { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: #fff; flex-shrink: 0; }
  .card-body { flex: 1; }
  .card-name { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 6px; }
  .card-benefits { list-style: none; padding: 0; }
  .card-benefits li { padding: 3px 0 3px 16px; position: relative; color: #555; font-size: 13px; line-height: 1.5; }
  .card-benefits li::before { content: "•"; position: absolute; left: 4px; color: #7c3aed; font-weight: 700; }
  .card-phone { margin-top: 8px; font-size: 12px; color: #888; }
  .scroll-area { flex: 1; overflow-y: auto; }
  .empty-msg { color: #888; font-size: 14px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div class="modal-wrap">
  <div class="modal-header">
    <div class="modal-title">💳 제휴카드 안내</div>
    <button class="modal-close" onclick="closeParent()" aria-label="닫기">✕</button>
  </div>
  <div class="scroll-area">
    <div class="modal-body" id="cardList"></div>
  </div>
</div>
<script>
  const CARDS = [
    {
      brand: "코웨이",
      key: "cwcard",
      name: "마이 코웨이 하나카드",
      benefits: [
        "30만원 이상 13,000원 할인",
        "코웨이 렌탈료 자동이체 시 추가 혜택"
      ],
      phone: "발급신청: 1800-1000"
    },
    {
      brand: "청호",
      key: "chcard",
      name: "청호나이스 제휴카드",
      benefits: [
        "청호나이스 렌탈료 최대 12,000원 할인",
        "생활가전 구매 시 추가 할인"
      ],
      phone: "발급신청: 1577-0000"
    },
    {
      brand: "SK",
      key: "skcard",
      name: "SK매직 제휴카드",
      benefits: [
        "SK매직 렌탈료 최대 10,000원 할인",
        "정기관리비 면제 혜택"
      ],
      phone: "발급신청: 1588-0000"
    },
    {
      brand: "쿠쿠",
      key: "cccard",
      name: "쿠쿠 제휴카드",
      benefits: [
        "쿠쿠 렌탈료 최대 10,000원 할인",
        "신제품 구매 시 할인"
      ],
      phone: "발급신청: 1588-9100"
    },
    {
      brand: "LG",
      key: "lgcard",
      name: "LG전자 제휴카드",
      benefits: [
        "LG전자 렌탈료 최대 12,000원 할인",
        "LG 가전 패키지 구매 시 추가 혜택"
      ],
      phone: "발급신청: 1544-0000"
    },
    {
      brand: "웰스",
      key: "wscard",
      name: "웰스 제휴카드",
      benefits: [
        "웰스 렌탈료 최대 8,000원 할인",
        "정수기 필터 교체 할인"
      ],
      phone: "발급신청: 1588-1234"
    },
    {
      brand: "현대",
      key: "hdcard",
      name: "현대큐밍 제휴카드",
      benefits: [
        "현대큐밍 렌탈료 최대 10,000원 할인",
        "청정기 패키지 할인"
      ],
      phone: "발급신청: 1588-0000"
    },
    {
      brand: "세스코",
      key: "cescard",
      name: "세스코 제휴카드",
      benefits: [
        "세스코 렌탈료 최대 10,000원 할인",
        "방문관리비 할인"
      ],
      phone: "발급신청: 1588-0000"
    }
  ];

  function cardImageUrl(key) {
    const map = {
      cwcard: 'https://allnup.com/card/1cwcard.png?v=8a179766544efaf313dbbf3d0db2d26a',
      chcard: 'https://allnup.com/card/2chcard.png?v=1e5d183557d76f36c45b70abbb8f1a83',
      skcard: 'https://allnup.com/card/3skcard.png?v=03e53fdfdafa4a8efc4370c0f941f4b5',
      cccard: 'https://allnup.com/card/4cccard.png?v=28e57d79f5259b3bea31357c4b63f028',
      wscard: 'https://allnup.com/card/6wscard.png?v=48992eccbfc31e8ea28d2d401cb07180',
      lgcard: 'https://allnup.com/card/5lgcard.png?v=de0cd560d914d8c4815d40f8105cebbc',
      hdcard: 'https://allnup.com/card/7hdcard.png?v=b00f3b1c5248422a610af5653f1fb9ff',
      cescard: 'https://allnup.com/card/8cescard.jpg?v=86f004e167506159c318b6e48440881c'
    };
    return map[key] || map['cwcard'];
  }

  function closeParent() {
    if (window.parent && typeof window.parent.closeCardOverlay === 'function') {
      window.parent.closeCardOverlay();
    } else {
      window.close();
    }
  }

  function render() {
    const el = document.getElementById('cardList');
    if (!el) return;
    el.innerHTML = CARDS.map(function(c) {
      const benefitsHtml = c.benefits.map(function(b) { return '<li>' + b + '</li>'; }).join('');
      return '<div class="card-item">' +
        '<div class="card-row">' +
          '<img class="card-img" src="' + cardImageUrl(c.key) + '" alt="' + c.brand + ' 제휴카드" onerror="this.style.display=\'none\'">' +
          '<div class="card-body">' +
            '<div class="card-name">' + c.name + '</div>' +
            '<ul class="card-benefits">' + benefitsHtml + '</ul>' +
            '<div class="card-phone">' + c.phone + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  render();
</script>
</body>
</html>
