<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>당월 주요 프로모션</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/style/button_animation.css">
    <link rel="stylesheet" href="../assets/style/button_style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
        background-color: #ffffff !important; /* ✅ 전체 배경 흰색 */
        font-size: 1.1rem;
        }
@media (max-width: 768px) {
    body {
        font-size: 0.9rem; /* ✅ 모바일 화면에서 폰트 크기 줄임 */
    }
}

@font-face {
  font-family: 'cafe';
  src: url('fonts/cafe.woff2') format('woff2'),
       url('fonts/cafe.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

body {
  font-family: 'cafe', sans-serif;
}

.card-box {
  background-color: #FFFFFF;
  border: 1px solid #0002;
  box-shadow: 0.1em 0.1em 0.5em #0003;
  border-radius: 0.5em;
  padding: 1em;
}

.card-title {
  position: absolute;
  top: -0.8em;
  left: 1em;
  background-color: #fff;
  padding: 0 0.8em;
  font-weight: bold;
  border-radius: 1em;
  font-size: 1.1rem;
  margin: 0;
}

        pre {
            white-space: pre-wrap;
            font-family: inherit;
            margin: 0;
        }

        .highlight {
            background-color: #fff3a3;
            font-weight: 700;
            border-radius: 4px;
            padding: 0 1px;
        }

        .highlight.active {
            background-color: #ffb84d !important;
            color: #111827;
        }

        .promo-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 10px 0 0;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        .promo-search-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .promo-search-row-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .promo-keyword-wrap {
            flex: 1 1 auto;
            min-width: 0;
        }

        .promo-keyword-input {
            min-height: 48px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: none !important;
            padding: 0 16px;
            font-size: 1rem;
            color: #111827;
        }

        .promo-keyword-input:focus {
            border-color: #c7d2fe;
            box-shadow: 0 0 0 0.18rem rgba(94, 124, 255, 0.12) !important;
        }

        .promo-help-wrap {
            position: relative;
            flex: 0 0 auto;
        }

        .promo-help-trigger {
            width: 44px;
            height: 44px;
            border: 1px solid #dbe3f0;
            border-radius: 999px;
            background: #fff;
            color: #374151;
            font-size: 1.05rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .promo-help-trigger:hover {
            background: #f8fafc;
        }

        .promo-help-trigger:focus,
        .promo-help-trigger:focus-visible {
            outline: none;
            box-shadow: 0 0 0 0.18rem rgba(94, 124, 255, 0.12);
        }

        .promo-help-popup {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 290px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.14);
            padding: 14px 15px;
            display: none;
        }

        .promo-help-popup.show {
            display: block;
        }

        .promo-help-title {
            font-weight: 800;
            font-size: 0.96rem;
            color: #111827;
            margin-bottom: 8px;
        }

        .promo-help-list {
            margin: 0;
            padding-left: 18px;
            color: #4b5563;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .promo-search-row-actions {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
        }

        .promo-action-btn {
            min-width: 0;
            min-height: 52px;
            border: 0;
            background: #fff;
            color: #111827;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            line-height: 1.2;
            box-shadow: none !important;
        }

        .promo-action-btn + .promo-action-btn {
            border-left: 1px solid #edf1f5;
        }

        .promo-action-btn:hover {
            background: #f8fafc;
        }

        .promo-action-btn:focus,
        .promo-action-btn:focus-visible {
            outline: none;
            background: #f3f6fb;
        }

        .promo-action-inner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 0;
        }

        .promo-action-icon {
            width: 15px;
            height: 15px;
            object-fit: contain;
            flex: 0 0 15px;
            pointer-events: none;
        }

        .promo-action-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .promo-accordion-wrap {
            margin-top: 0;
        }

        .promo-accordion .accordion-item {
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 12px;
            background: #fff;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
        }

        .promo-accordion .accordion-header {
            margin: 0;
        }

        .promo-accordion .accordion-button {
            padding: 16px 18px;
            background: #fff;
            color: #111827;
            font-weight: 800;
            font-size: 0.98rem;
            box-shadow: none !important;
            gap: 10px;
        }

        @media (min-width: 992px) {
            .promo-page-container {
                max-width: 840px;
            }
        }

        .promo-accordion .accordion-button:not(.collapsed) {
            background: #f8fbff;
            color: #111827;
        }

        .promo-accordion .accordion-button:focus {
            box-shadow: none !important;
        }

        .promo-accordion-logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            min-width: 62px;
        }

        .promo-accordion-logo {
            display: block;
            height: 34px;
            width: auto;
            max-width: 80px;
            object-fit: contain;
            flex: 0 0 auto;
            pointer-events: none;
        }

        .promo-accordion-title {
            flex: 1 1 auto;
            min-width: 0;
            word-break: keep-all;
        }

        .promo-accordion-body {
            padding: 18px 20px 20px;
            background: linear-gradient(180deg, #fbfcfe 0%, #ffffff 100%);
            border-top: 1px solid rgba(15, 23, 42, 0.06);
        }

        .promo-text {
            margin: 0;
            font-size: 0.97rem;
            line-height: 1.72;
            color: #1f2937;
            white-space: pre-wrap;
            word-break: keep-all;
        }

        .promo-empty-text {
            padding: 32px 12px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .promo-toolbar {
                padding-top: 6px;
            }

            .promo-search-row-top {
                gap: 8px;
            }

            .promo-keyword-input {
                min-height: 44px;
                border-radius: 13px;
                font-size: 0.95rem;
                padding: 0 14px;
            }

            .promo-help-trigger {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .promo-help-popup {
                width: min(290px, calc(100vw - 44px));
                right: -4px;
                padding: 13px 14px;
            }

            .promo-search-row-actions {
                border-radius: 14px;
            }

            .promo-action-btn {
                min-height: 64px;
                padding: 8px 4px;
                font-size: 0.88rem;
            }

            .promo-action-inner {
                flex-direction: column;
                gap: 4px;
            }

            .promo-action-icon {
                width: 16px;
                height: 16px;
                flex: 0 0 16px;
            }

            .promo-action-text {
                font-size: 0.81rem;
                line-height: 1.15;
                letter-spacing: -0.02em;
            }

            .promo-accordion .accordion-item {
                border-radius: 16px;
                margin-bottom: 10px;
            }

            .promo-accordion .accordion-button {
                padding: 12px 14px;
                font-size: 0.93rem;
                gap: 8px;
            }

            .promo-accordion-logo-wrap {
                min-width: 52px;
            }

            .promo-accordion-logo {
                height: 28px;
                max-width: 64px;
            }

            .promo-accordion-body {
                padding: 15px 16px 17px;
            }

            .promo-text {
                font-size: 0.9rem;
                line-height: 1.68;
            }
        }
    </style>
</head>
<body>
<main class="container-fluid py-4 py-md-5">

<div class="container promo-page-container">
    <div class="card-box position-relative" style="margin-bottom: 1.6rem;">
        <h5 class="card-title">검색</h5>

    <div class="sticky-toolbar promo-toolbar">
      <div class="promo-search-panel">
        <div class="promo-search-row-top">
          <div class="promo-keyword-wrap">
            <input type="text" id="keywordInput" class="form-control promo-keyword-input" placeholder="키워드 입력" autofocus autocomplete="off">
          </div>

          <div class="promo-help-wrap">
            <button type="button" class="promo-help-trigger" id="helpToggleBtn" aria-label="사용법 안내" aria-expanded="false">?</button>

            <div class="promo-help-popup" id="helpPopup">
              <div class="promo-help-title">사용법 안내</div>
              <ul class="promo-help-list">
                <li>입력 후 Enter 또는 검색 버튼 클릭</li>
                <li>이전/다음 버튼으로 검색 결과를 이동</li>
                <li>모두열기/접기로 전체 한번에 열기/접기</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="promo-search-row-actions" role="toolbar" aria-label="프로모션 검색 도구">
          <button type="button" class="promo-action-btn" id="prevBtn" title="이전">
            <span class="promo-action-inner">
              <img src="../assets/webimage/button/pre.png" alt="" class="promo-action-icon">
              <span class="promo-action-text">이전</span>
            </span>
          </button>

          <button type="button" class="promo-action-btn" id="nextBtn" title="다음">
            <span class="promo-action-inner">
              <img src="../assets/webimage/button/next.png" alt="" class="promo-action-icon">
              <span class="promo-action-text">다음</span>
            </span>
          </button>

          <button type="button" class="promo-action-btn" id="searchBtn" title="검색">
            <span class="promo-action-inner">
              <img src="../assets/webimage/button/search.png" alt="" class="promo-action-icon">
              <span class="promo-action-text">검색</span>
            </span>
          </button>

          <button type="button" class="promo-action-btn" id="toggleAllBtn" title="모두 열기 또는 모두 접기" data-open-label="모두 열기" data-close-label="모두 접기">
            <span class="promo-action-inner">
              <img src="../assets/webimage/button/open.png" alt="" class="promo-action-icon">
              <span class="promo-action-text">모두 열기</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card-box position-relative mb-3">
    <h5 class="card-title">프로모션</h5>
    <div id="promoContainer" class="promo-accordion-wrap"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const input = document.getElementById("keywordInput");
const searchBtn = document.getElementById("searchBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const toggleAllBtn = document.getElementById("toggleAllBtn");
const container = document.getElementById("promoContainer");
const helpToggleBtn = document.getElementById("helpToggleBtn");
const helpPopup = document.getElementById("helpPopup");

let currentMatchIndex = -1;
let matches = [];
let allOpen = false;

const brandLogoBasePath = "../assets/webimage/button/";
const brandLogoMap = {
    "청호나이스": "chungho.png",
    "코웨이": "coway.png",
    "SK": "sk.png",
    "쿠쿠": "cuckoo.png",
    "LG": "lg.png",
    "웰스": "wells.png",
    "현대": "hyundai.png",
    "세스코": "cesco.png"
};

function escapeRegExp(text) {
    return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
}

function getBrandLogoFilename(brandTitle) {
    const raw = String(brandTitle || "").trim();
    if (brandLogoMap[raw]) return brandLogoMap[raw];

    const normalized = raw.replace(/\s+/g, "");
    const foundKey = Object.keys(brandLogoMap).find(key => key.replace(/\s+/g, "") === normalized);

    return foundKey ? brandLogoMap[foundKey] : "";
}

function buildBrandLogoHtml(brandTitle) {
    const filename = getBrandLogoFilename(brandTitle);
    const safeTitle = escapeHtml(brandTitle);

    if (!filename) {
        return "";
    }

    return `
        <span class="promo-accordion-logo-wrap">
            <img src="${brandLogoBasePath}${filename}" alt="${safeTitle} 로고" class="promo-accordion-logo">
        </span>
    `;
}

function updateToggleButtonLabel() {
    const textEl = toggleAllBtn.querySelector(".promo-action-text");
    const openLabel = toggleAllBtn.dataset.openLabel || "모두 열기";
    const closeLabel = toggleAllBtn.dataset.closeLabel || "모두 접기";

    if (textEl) {
        textEl.textContent = allOpen ? closeLabel : openLabel;
    }
}

function setAllOpenState(value) {
    allOpen = !!value;
    updateToggleButtonLabel();
}

function syncAccordionToggleState() {
    const list = Array.from(document.querySelectorAll(".accordion-collapse"));
    if (list.length === 0) {
        setAllOpenState(false);
        return;
    }

    const openedCount = list.filter(el => el.classList.contains("show")).length;
    setAllOpenState(openedCount === list.length && list.length > 0);
}

function resetAllAccordions() {
    document.querySelectorAll(".accordion-collapse").forEach(el => {
        const instance = bootstrap.Collapse.getOrCreateInstance(el, { toggle: false });
        instance.hide();
    });
    setAllOpenState(false);
}

function clearHighlights() {
    document.querySelectorAll(".promo-text").forEach(pre => {
        const original = pre.dataset.original || "";
        pre.innerHTML = original;
    });
    matches = [];
    currentMatchIndex = -1;
}

function highlightAndStore(keyword) {
    clearHighlights();
    resetAllAccordions();

    if (!keyword) return;

    const regex = new RegExp(`(${escapeRegExp(keyword)})`, "gi");

    document.querySelectorAll(".accordion-item").forEach(item => {
        const pre = item.querySelector(".promo-text");
        if (!pre) return;

        const text = pre.dataset.original || "";

        if (text.toLowerCase().includes(keyword.toLowerCase())) {
            pre.innerHTML = text.replace(regex, '<span class="highlight">$1</span>');

            const collapse = item.querySelector(".accordion-collapse");
            if (collapse) {
                const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false });
                bsCollapse.show();
            }

            pre.querySelectorAll("span.highlight").forEach(span => matches.push(span));
        }
    });

    if (matches.length > 0) {
        moveToNextMatch();
    }
}

function moveToNextMatch() {
    if (matches.length === 0) return;
    currentMatchIndex = (currentMatchIndex + 1) % matches.length;
    scrollToMatch(currentMatchIndex);
}

function moveToPrevMatch() {
    if (matches.length === 0) return;
    currentMatchIndex = (currentMatchIndex - 1 + matches.length) % matches.length;
    scrollToMatch(currentMatchIndex);
}

function scrollToMatch(index) {
    matches.forEach(span => span.classList.remove("active"));

    const target = matches[index];
    if (!target) return;

    const collapse = target.closest(".accordion-collapse");
    if (collapse) {
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false });
        bsCollapse.show();
    }

    target.classList.add("active");
    target.scrollIntoView({ behavior: "smooth", block: "center" });
}

function toggleAllAccordions() {
    const list = Array.from(document.querySelectorAll(".accordion-collapse"));
    if (list.length === 0) return;

    const nextState = !allOpen;

    list.forEach(el => {
        const instance = bootstrap.Collapse.getOrCreateInstance(el, { toggle: false });
        if (nextState) {
            instance.show();
        } else {
            instance.hide();
        }
    });

    setAllOpenState(nextState);
}

function closeHelpPopup() {
    helpPopup.classList.remove("show");
    helpToggleBtn.setAttribute("aria-expanded", "false");
}

setAllOpenState(false);

input.addEventListener("input", () => {
    clearHighlights();
    resetAllAccordions();
});

searchBtn.addEventListener("click", () => {
    const keyword = input.value.trim();
    highlightAndStore(keyword);
});

input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        searchBtn.click();
    } else if (e.key === "ArrowDown") {
        e.preventDefault();
        moveToNextMatch();
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        moveToPrevMatch();
    } else if (e.key === "Escape") {
        closeHelpPopup();
    }
});

prevBtn.addEventListener("click", moveToPrevMatch);
nextBtn.addEventListener("click", moveToNextMatch);
toggleAllBtn.addEventListener("click", toggleAllAccordions);

helpToggleBtn.addEventListener("click", e => {
    e.stopPropagation();
    const willOpen = !helpPopup.classList.contains("show");
    helpPopup.classList.toggle("show", willOpen);
    helpToggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
});

document.addEventListener("click", e => {
    if (!e.target.closest(".promo-help-wrap")) {
        closeHelpPopup();
    }
});

document.addEventListener("shown.bs.collapse", e => {
    if (e.target.classList.contains("accordion-collapse")) {
        syncAccordionToggleState();
    }
});

document.addEventListener("hidden.bs.collapse", e => {
    if (e.target.classList.contains("accordion-collapse")) {
        syncAccordionToggleState();
    }
});

fetch("../data/promo.json", { credentials: "include", cache: "no-store" })
    .then(res => res.json())
    .then(payload => {
        const promoText = (payload && typeof payload.promo_text === "string") ? payload.promo_text : "";

        if (!promoText) {
            container.innerHTML = "<p class='promo-empty-text text-center mb-0'>이번 달 주요 프로모션 정보가 없습니다.</p>";
            return;
        }

        const sections = promoText
            .split("--------------------------------------------------------------------")
            .map(s => s.trim())
            .filter(Boolean);

        const accordion = document.createElement("div");
        accordion.className = "accordion promo-accordion";
        accordion.id = "promoAccordion";

        sections.forEach((section, i) => {
            const match = section.match(/\u25b6\s*(.+)/);
            const brandTitle = match ? match[1].trim() : `브랜드 ${i + 1}`;
            const collapseId = `collapse${i}`;
            const headingId = `heading${i}`;
            const safeText = escapeHtml(section);
            const safeTitle = escapeHtml(brandTitle);
            const brandLogoHtml = buildBrandLogoHtml(brandTitle);

            accordion.innerHTML += `
                <div class="accordion-item">
                    <h2 class="accordion-header" id="${headingId}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#${collapseId}" aria-expanded="false" aria-controls="${collapseId}">
                            ${brandLogoHtml}
                            <span class="promo-accordion-title">${safeTitle}</span>
                        </button>
                    </h2>
                    <div id="${collapseId}" class="accordion-collapse collapse" aria-labelledby="${headingId}">
                        <div class="accordion-body promo-accordion-body">
                            <pre class="promo-text" data-original="${safeText}">${safeText}</pre>
                        </div>
                    </div>
                </div>`;
        });

        container.innerHTML = "";
        container.appendChild(accordion);
        setAllOpenState(false);
    })
    .catch(err => {
        console.error("데이터 로드 실패", err);
        container.innerHTML = "<p class='promo-empty-text text-center text-danger mb-0'>데이터 로드 실패</p>";
    });
</script>

      <p class="fw-bold mb-2">◎ 에러 / 문의 / 건의사항 이용방법</p>

      </p>
      <p>© 2026 All rights reserved.</p>
    </div>

    <!-- ✅ 웹: 전부 한 줄 -->
<div class="footer-desktop">

<style>
.custom-footer {
  background: #ffffff;
  padding: 20px;
  border-top: 1px solid #ccc;
  font-size: 14px;
  color: #333;
}

.custom-footer a {
  color: #007bff; /* 원하는 강조 색상으로 바꿔도 됨 */
  text-decoration: none; /* 밑줄 제거 */
}

.footer-container {
  max-width: 1000px;
  margin: 0 auto;
  text-align: center;
  line-height: 1.6;
}

.footer-mobile {
  display: block;
}

.footer-desktop {
  display: none;
}

.footer-list {
  list-style-position: inside;
  padding-left: 0;
  margin: 0 auto;
  display: inline-block;
  text-align: center;
}

@media (min-width: 992px) {
  .footer-mobile {
    display: none;
  }
  .footer-desktop {
    display: block;
  }
}
</style></body>
</html>
