<script>
const allowedBrandList = ["청호","코웨이","SK","쿠쿠","LG","웰스","현대","세스코"];
const isBrandMasterUser = false;
const allowedBrandSet = new Set(
    (Array.isArray(allowedBrandList) ? allowedBrandList : []).map(v => String(v || "").trim())
);

function filterWorksheetRowsByBrandAccess(rows) {
    if (!Array.isArray(rows)) return [];

    if (isBrandMasterUser) {
        return rows;
    }

    if (allowedBrandSet.size === 0) {
        return [];
    }

    return rows.filter(row => {
        const brand = String((row && row["브랜드"]) || "").trim();
        return allowedBrandSet.has(brand);
    });
}

const columns = [
    "제품군", "브랜드", "상품명", "모델명", "규정",
    "3년 관리", "3년 렌탈료", "3년 지원금",
    "4년 관리", "4년 렌탈료", "4년 지원금",
    "5년 관리", "5년 렌탈료", "5년 지원금",
    "6년 관리", "6년 렌탈료", "6년 지원금",
    "7년 관리", "7년 렌탈료", "7년 지원금",
    "9년 관리", "9년 렌탈료", "9년 지원금"
];

let worksheetData = [];
let currentSort = { column: null, order: 'asc' };
let headerFilterMap = {};  // ✅ key: column name, value: array of checked values
let currentFilterColumn = null;
let table;

// ✅ Tabulator 컬럼 정의를 보관(모바일 → PC 전환 시 Tabulator 초기화에 필요)
let lastTabulatorColumns = null;

// ✅ 모바일 전용: 약정 탭 + 카드 렌더링
const contractYears = ["3년", "4년", "5년", "6년", "7년", "9년"];
let mobileSelectedYear = "5년";
let mobilePage = 1;
const mobilePageSize = 50;

// ✅ 모바일 정렬/필터 상태(PC에 영향 없음)
let mobileSortField = "fee";
let mobileSortDir = "asc";

// ✅ 모바일 전용 필터(PC headerFilterMap과 분리)
let mobileHeaderFilterMap = {}; // key: "브랜드", "규정", "5년 관리" 형태

function mobileManageKey() {
  return `${mobileSelectedYear} 관리`;
}

function parseNum(val) {
  const s = String(val ?? "").replace(/,/g, "").trim();
  if (s === "") return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function sortMobileData(rows) {
  const year = mobileSelectedYear;

  function getSortVal(row) {
    if (mobileSortField === "name") {
      const s = (row["상품명"] || "").toString().trim();
      return s === "" ? null : s;
    }
    const col = (mobileSortField === "fee") ? `${year} 렌탈료` : `${year} 지원금`;
    return parseNum(row[col]);
  }

  // ✅ 1) 빈값(null/empty)은 따로 모아서 "항상 맨 아래"로 보냄
  const withIdx = rows.map((r, i) => ({ r, i, v: getSortVal(r) }));
  const nonEmpty = withIdx.filter(x => x.v !== null);
  const empty = withIdx.filter(x => x.v === null);

  // ✅ 2) nonEmpty만 정렬 (동점일 때는 원래 순서 유지)
  nonEmpty.sort((a, b) => {
    if (mobileSortField === "name") {
      const r = String(a.v).localeCompare(String(b.v), "ko");
      if (r !== 0) return (mobileSortDir === "asc") ? r : -r;
      return a.i - b.i;
    }

    const r = a.v - b.v;
    if (r !== 0) return (mobileSortDir === "asc") ? r : -r;
    return a.i - b.i;
  });

  // ✅ 3) 마지막에 empty를 그대로 붙임 (정렬 제외)
  return nonEmpty.map(x => x.r).concat(empty.map(x => x.r));
}

let currentMobileFilterKey = null;

function renderMobileFilterOptions(type) {
  let key = "";
  let title = "";

  if (type === "brand") {
    key = "브랜드";
    title = "브랜드";
  } else if (type === "rule") {
    key = "규정";
    title = "규정";
  } else if (type === "manage") {
    key = mobileManageKey();
    title = `${mobileSelectedYear} 관리`;
  } else {
    return;
  }

  currentMobileFilterKey = key;

  // 1) 현재 컬럼의 "전체 값 목록"(PC처럼 전체는 보여주되, 불가 값은 흐리게)
  const allValues = [...new Set(
    worksheetData.map(r => (r[key] ?? "").toString().trim()).filter(v => v !== "")
  )].sort((a, b) => a.localeCompare(b, "ko"));

  // 2) "다른 필터들"만 적용된 상태에서 가능한 값(availableValues) 계산
  const originalMap = mobileHeaderFilterMap;
  const tempMap = Object.assign({}, mobileHeaderFilterMap);
  delete tempMap[key];

  // filterRow()를 그대로 재사용하기 위해 잠깐 치환 후 즉시 복구
  mobileHeaderFilterMap = tempMap;

  const filteredRows = worksheetData.filter(row => {
    return filterRow(row);
  });

  mobileHeaderFilterMap = originalMap;

  const availableValues = new Set(
    filteredRows
      .map(r => (r[key] ?? "").toString().trim())
      .filter(v => v !== "")
  );

  // 3) 팝업 렌더
  const selected = originalMap[key] || [];

  $("#mPopupTitle").text(title);
  $("#mPopupSubTitle").text(title);

  const $opts = $("#mPopupOptions").empty();

  allValues.forEach(v => {
    const isAvailable = availableValues.has(v);
    const isChecked = selected.includes(v);

    const dimStyle = isAvailable ? "" : 'style="opacity:0.4;"';

    $opts.append(
      `<div ${dimStyle} title="${v}">
        <label class="m-0">
          <input class="me-2 mPopupChk" type="checkbox" value="${v}" ${isChecked ? "checked" : ""}>
          ${v}
        </label>
      </div>`
    );
  });

  // 4) 전체선택 체크 상태(PC처럼 전체값 기준)
  const total = $("#mPopupOptions input.mPopupChk").length;
  const checked = $("#mPopupOptions input.mPopupChk:checked").length;
  $("#mPopupAll").prop("checked", total > 0 && total === checked);

  $("#mPopupSearch").val("");
}

function isMobileView() {
  return window.matchMedia("(max-width: 768px)").matches;
}

function getCell(row, key) {
  const v = row[key];
  return (v === undefined || v === null) ? "" : String(v).trim();
}

function getYearKey(year, suffix) {
  return `${year} ${suffix}`;
}

function renderMobileTabs() {
  const $tabs = $("#contractTabs").empty();

  contractYears.forEach((y) => {
    const active = (y === mobileSelectedYear) ? "active" : "";
    $tabs.append(`
      <li class="nav-item" role="presentation">
        <button class="nav-link ${active}" type="button" data-year="${y}">${y}</button>
      </li>
    `);
  });
}

function buildMobileCard(row, idx) {
  const product = getCell(row, "제품군");
  const brand   = getCell(row, "브랜드");
  const name    = getCell(row, "상품명");
  const model   = getCell(row, "모델명");
  const rule    = getCell(row, "규정"); // ✅ 공통(한 번만 표시)

  const manage = getCell(row, getYearKey(mobileSelectedYear, "관리"));
  const fee    = getCell(row, getYearKey(mobileSelectedYear, "렌탈료"));
  const sup    = getCell(row, getYearKey(mobileSelectedYear, "지원금"));

  const collapseId = `mcard_${idx}`;

  const otherLines = contractYears
    .filter(y => y !== mobileSelectedYear)
    .map(y => {
      const m = getCell(row, getYearKey(y, "관리"));
      const f = getCell(row, getYearKey(y, "렌탈료"));
      const s = getCell(row, getYearKey(y, "지원금"));

      if (!m && !f && !s) return "";

      return `
        <div class="d-flex justify-content-between align-items-start py-1 border-top">
          <div class="fw-bold" style="min-width:48px;">${y}</div>
          <div class="flex-grow-1 text-end">
            <div class="small text-muted">${m ? `관리: ${m}` : ""}</div>
            <div>${f ? `렌탈료: ${f}` : ""}</div>
            <div>${s ? `지원금: ${s}` : ""}</div>
          </div>
        </div>
      `;
    })
    .filter(html => html !== "")
    .join("");

  const row1Brand  = brand ? brand : "";
  const row1Product = product ? product : "분류없음";

  return `
    <div class="card mb-2" style="border:1px solid #e6e6e6; border-radius:12px;">
      <div class="card-body p-3">
        <div class="d-flex align-items-center gap-2 mb-1">
          <div class="small fw-bold">${row1Brand}</div>
          <div class="small text-muted">${row1Product}</div>
        </div>

        <div class="fw-bold" style="font-size:1.05rem; line-height:1.25;">${name}</div>
        <div class="text-muted small mb-2">${model}</div>

        <div class="d-flex flex-wrap gap-3 align-items-start mb-1">
          <div class="small">
            <span class="text-muted">규정:</span>
            <span class="fw-bold">${rule}</span>
          </div>
          <div class="small">
            <span class="text-muted">${mobileSelectedYear} 관리:</span>
            <span class="fw-bold">${manage}</span>
          </div>
        </div>

        <div class="d-flex flex-wrap gap-3 align-items-center">
          <div class="small">
            <span class="text-muted">${mobileSelectedYear} 렌탈료:</span>
            <span class="fw-bold">${fee}</span>
          </div>
          <div class="small">
            <span class="text-muted">${mobileSelectedYear} 지원금:</span>
            <span class="fw-bold">${sup}</span>
          </div>
        </div>

        <div class="mt-2">
          <button class="btn details-outline-btn details-btn-card-toggle btn-animate w-100" type="button"
            data-bs-toggle="collapse" data-bs-target="#${collapseId}">
            <span class="btn-inline-icon-wrap">
              <img src="./assets/webimage/button/detail.png" alt="" class="btn-inline-icon">
              <span>다른 약정 보기</span>
            </span>
          </button>
        </div>

        <div class="collapse mt-2" id="${collapseId}">
          <div class="border rounded p-2" style="background:#fafbfc;">
            ${otherLines ? otherLines : `<div class="text-muted small">다른 약정 데이터가 없습니다.</div>`}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderMobileCards(sortedAll) {
  if (!isMobileView()) return;

  $("#mobileCards").empty();
  $("#mobileLoadMore").addClass("d-none");

  const maxCount = mobilePage * mobilePageSize;
  const slice = sortedAll.slice(0, maxCount);

  const html = slice.map((row, i) => buildMobileCard(row, i)).join("");
  $("#mobileCards").html(html);

  if (sortedAll.length > slice.length) {
    $("#mobileLoadMore").removeClass("d-none");
  }
}

function updateDetailsMobileBottomOffset() {
  const body = document.body;
  if (!body) return;

  if (!isMobileView()) {
    body.style.setProperty("--details-mobile-bottom-offset", "0px");
    return;
  }

  let localBottomOffset = 0;

  if (window.visualViewport) {
    const vv = window.visualViewport;
    const visibleBottom = vv.height + vv.offsetTop;
    localBottomOffset = Math.max(0, window.innerHeight - visibleBottom);
  }

  let parentFrameOverlap = 0;

  try {
    if (window.parent && window.parent !== window && window.frameElement) {
      const frameRect = window.frameElement.getBoundingClientRect();

      let parentVisibleBottom = window.parent.innerHeight;
      if (window.parent.visualViewport) {
        parentVisibleBottom = window.parent.visualViewport.height + window.parent.visualViewport.offsetTop;
      }

      parentFrameOverlap = Math.max(0, frameRect.bottom - parentVisibleBottom);
    }
  } catch (e) {
    parentFrameOverlap = 0;
  }

  const finalOffset = Math.max(localBottomOffset, parentFrameOverlap);
  body.style.setProperty("--details-mobile-bottom-offset", Math.ceil(finalOffset) + "px");
}

function updateMobileScrollTopButton() {
  const btn = document.getElementById("mobileScrollTopBtn");
  if (!btn) return;

  if (!isMobileView()) {
    btn.classList.remove("show");

function initializeKeywordAutocomplete() {
    const $keyword = $("#filterKeyword");
    if ($keyword.length === 0) return;

    if ($keyword.data("ui-autocomplete")) {
        $keyword.autocomplete("destroy");
    }
    $keyword.off(".keywordAutocomplete");

    const seen = new Set();
    const suggestions = worksheetData
        .map(row => {
            const name = String(row["상품명"] || "").trim();
            const model = String(row["모델명"] || "").trim();

            if (!name && !model) return null;

            const label = model ? `${name}//${model}` : name;
            const matchKey = `${name}${model}`.toLowerCase().replace(/[\s-]/g, '');

            return {
                label: label,
                value: label,
                matchKey: matchKey
            };
        })
        .filter(item => {
            if (!item) return false;
            if (seen.has(item.label)) return false;
            seen.add(item.label);
            return true;
        });

    $keyword.autocomplete({
        source: function (request, response) {
            const term = String(request.term || "").toLowerCase().replace(/[\s-]/g, '');
            const list = suggestions
                .filter(item => term === "" || item.matchKey.includes(term))
                .slice(0, 50);

            response(list);
        },
        minLength: 1,
        appendTo: "body",
        position: {
            my: "left top",
            at: "left bottom",
            collision: "flipfit"
        },
        select: function (event, ui) {
            setTimeout(() => {
                $("#filterKeyword").val(ui.item.value);
                mobilePage = 1;
                applyUnifiedFilter();
            }, 10);
        }
    });

    $keyword.on("focus.keywordAutocomplete", function () {
        const value = this.value.trim();
        if (value.length >= 1) {
            $(this).autocomplete("search", value);
        }
    });
}

function positionMobileFilterPopupByAnchor(anchorEl) {
  const $pop = $("#mobileFilterPopup");
  if (!anchorEl || $pop.length === 0) return;

  const wasHidden = ($pop.css("display") === "none");
  if (wasHidden) {
    $pop.css({ visibility: "hidden", display: "block" });
  }

  const btnRect = anchorEl.getBoundingClientRect();
  const popRect = $pop[0].getBoundingClientRect();

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const margin = 8;

  let top = btnRect.bottom + 6;
  let left = btnRect.right - popRect.width;

  if (left < margin) left = margin;
  if (left + popRect.width > vw - margin) left = vw - popRect.width - margin;

  if (top + popRect.height > vh - margin) {
    top = btnRect.top - popRect.height - 6;
  }
  if (top < margin) top = margin;

  const maxH = vh - (margin * 2);
  $pop.css({
    top: `${Math.round(top)}px`,
    left: `${Math.round(left)}px`,
    maxHeight: `${Math.max(160, Math.floor(maxH))}px`
  });

  if (wasHidden) {
    $pop.css({ visibility: "visible" });
  }
}

function openMobileFilterPopup(type, anchorEl) {
  _mobilePopupAnchor = anchorEl || null;

  renderMobileFilterOptions(type);

  const $pop = $("#mobileFilterPopup");
  $pop.show();
  positionMobileFilterPopupByAnchor(anchorEl);
}

function getColWidth(idx, col) {
    if(idx === 1) return 140; // 제품군
    if(idx === 2) return 60;  // 브랜드
    if(idx === 3) return 180; // 상품명
    if(idx === 4) return 140; // 모델명
    if(idx === 5) return 90;  // 규정

    if([6,9,12,15,18,21].includes(idx)) return 89;
    if([7,8,10,11,13,14,16,17,19,20,22,23].includes(idx)) return 94;

    return 120;
}

    const min = parseInt($("#filterMin").val().replace(/,/g, '')) || null;
    const max = parseInt($("#filterMax").val().replace(/,/g, '')) || null;
    const keyword = $("#filterKeyword").val().trim().toLowerCase().replace(/[\s-]/g, '');

    if (contract && min && max && min > max) return false;

    const rowProduct = row["제품군"] || "";
    if (selectedProducts.length > 0 && !selectedProducts.includes(rowProduct)) return false;

    if (period === "셀프") {
        const allPeriods = [
            row["3년 관리"], row["4년 관리"], row["5년 관리"],
            row["6년 관리"], row["7년 관리"], row["9년 관리"]
        ].join(" ");
        if (!(allPeriods.includes("셀프") || allPeriods.includes("서비스프리"))) return false;
    }

    if (period === "방문") {
        const allPeriods = [
            row["3년 관리"], row["4년 관리"], row["5년 관리"],
            row["6년 관리"], row["7년 관리"], row["9년 관리"]
        ].join(" ");
        if (allPeriods.includes("셀프") || allPeriods.includes("서비스프리")) return false;
    }

    if (keyword) {
        const name = (row["상품명"] || "").toLowerCase().replace(/[\s-]/g, '');
        const model = (row["모델명"] || "").toLowerCase().replace(/[\s-]/g, '');
        if (!name.includes(keyword) && !model.includes(keyword)) return false;
    }

    if (contract && (min || max)) {
        const feeCol = contract + " 렌탈료";
        const raw = (row[feeCol] || "").replace(/,/g, '');
        if (raw === "") return false;
        const value = parseInt(raw, 10);
        if (min && value < min) return false;
        if (max && value > max) return false;
    }

    const activeHeaderMap = isMobileView() ? mobileHeaderFilterMap : headerFilterMap;
    const headerFiltered = Object.entries(activeHeaderMap).every(([col, allowed]) => {
        if (!allowed || allowed.length === 0) return true;
        return allowed.includes((row[col] || "").trim());
    });
    if (!headerFiltered) return false;

    return true;
}

function populateDropdowns(filterType = null) {
    const productSet = new Set();
    const selectedPeriod = $("#filterPeriod").val();
    const selectedProducts = window.selectedProducts || [];

    worksheetData.forEach(row => {
        const product = row["제품군"];
        const allPeriods = [
            row["3년 관리"], row["4년 관리"], row["5년 관리"],
            row["6년 관리"], row["7년 관리"], row["9년 관리"]
        ].join(" ");

        const isSelf = allPeriods.includes("셀프") || allPeriods.includes("서비스프리");

        if (filterType === "period" && selectedPeriod === "셀프" && !isSelf) return;
        if (filterType === "period" && selectedPeriod === "방문" && isSelf) return;

        productSet.add(product);
    });

    const $productGroup = $("#filterProductOptions").empty();

    const desiredOrder = [
        "얼음냉온_데스크(직수)", "얼음냉정_데스크(직수)",
        "얼음냉온_데스크(탱크)", "얼음냉정_데스크(탱크)",
        "얼음냉온_스탠드(탱크)", "냉온_데스크(직수)",
        "냉정_데스크(직수)", "냉온_데스크(탱크)",
        "냉정_데스크(탱크)", "냉온_스탠드(직수)",
        "냉정_스탠드(직수)", "냉온_스탠드(탱크)",
        "온정_데스크(직수)", "정수_데스크(직수)",
        "정수_데스크(탱크)", "냉온_빌트인", "냉정_빌트인",
        "정수_빌트인", "커피", "비데", "청정기"
    ];

    const sortedProducts = [...productSet].sort((a, b) => {
        if (a === "") return 1;
        if (b === "") return -1;

        const indexA = desiredOrder.indexOf(a);
        const indexB = desiredOrder.indexOf(b);

        if (indexA === -1 && indexB === -1) return a.localeCompare(b, 'ko');
        if (indexA === -1) return 1;
        if (indexB === -1) return -1;

        return indexA - indexB;
    });

    $productGroup.append(`
        <div>
            <label>
                <input type="checkbox" id="productCheckAll">
                전체선택
            </label>
        </div>
    `);

    sortedProducts.forEach(p => {
        const label = p === "" ? "분류없음" : p;
        const checked = selectedProducts.includes(p) ? "checked" : "";
        $productGroup.append(`
            <div>
                <label>
                    <input type="checkbox" name="productCheckbox" value="${p}" ${checked}>
                    ${label}
                </label>
            </div>
        `);
    });

    const label = selectedProducts.length > 0 ? `제품군 (${selectedProducts.length})` : "전체";
    $("#productDropdownToggle").text(label);

    if (filterType !== "period") {
        let hasSelf = false;

        worksheetData.forEach(row => {
            const allPeriods = [
                row["3년 관리"], row["4년 관리"], row["5년 관리"],
                row["6년 관리"], row["7년 관리"], row["9년 관리"]
            ].join(" ");
            if (allPeriods.includes("셀프") || allPeriods.includes("서비스프리")) hasSelf = true;
        });

        const $periodSelect = $("#filterPeriod");
        const current = $periodSelect.val();
        $periodSelect.html('<option value="">전체</option>');
        if (hasSelf) $periodSelect.append(`<option value="셀프"${current === "셀프" ? " selected" : ""}>셀프</option>`);
        $periodSelect.append(`<option value="방문"${current === "방문" ? " selected" : ""}>방문</option>`);
    }
}

function updateHeaderFilterStatus() {
    if (!table) return;

    table.getColumns().forEach(col => {
        const field = col.getField();
        const colElem = col.getElement();
        if (filterPopupColumns.includes(field)) {
            const allValues = [...new Set(worksheetData.map(row => (row[field] ?? "").trim()).filter(v => v !== ""))];
            const filterArr = headerFilterMap[field] || [];
            if (filterArr.length > 0 && filterArr.length !== allValues.length) {
                $(colElem).addClass("filtered");
            } else {
                $(colElem).removeClass("filtered");
            }
        }
    });
}

</script>

<script>
(function () {
  function stripMobileButtonAnimation(root) {
    if (!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches)) return;

    const targets = [];

    if (root instanceof Element) {
      if (root.matches('.btn-animate')) {
        targets.push(root);
      }
      root.querySelectorAll('.btn-animate').forEach(function (el) {
        targets.push(el);
      });
    } else {
      document.querySelectorAll('.btn-animate').forEach(function (el) {
        targets.push(el);
      });
    }

    targets.forEach(function (btn) {
      btn.classList.remove('btn-animate');

      if (btn.dataset.mobileAnimBound === '1') return;
      btn.dataset.mobileAnimBound = '1';

      btn.addEventListener('click', function () {
        try { btn.blur(); } catch (e) {}
      }, true);

      btn.addEventListener('touchend', function () {
        try { btn.blur(); } catch (e) {}
      }, { passive: true });
    });
  }

  window.stripDetailsMobileButtonAnimation = stripMobileButtonAnimation;

  document.addEventListener('DOMContentLoaded', function () {
    stripMobileButtonAnimation(document.body);

    if (window.MutationObserver) {
      const observer = new MutationObserver(function (mutations) {
        if (!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches)) return;

        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node instanceof Element) {
              stripMobileButtonAnimation(node);
            }
          });
        });
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }
  });

  window.addEventListener('resize', function () {
    stripMobileButtonAnimation(document.body);
  });

  window.addEventListener('load', function () {
    stripMobileButtonAnimation(document.body);
  });
})();
</script>
