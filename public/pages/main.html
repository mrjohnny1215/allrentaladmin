<script>
(function () {
  let mobileUiObserver = null;
  let isPreparingMobileUI = false;

  function isMobileView() {
    return window.matchMedia('(max-width: 768px)').matches;
  }

  function stripMobileButtonAnimation(root) {
    if (!isMobileView()) return;

    (root || document).querySelectorAll('.btn-animate').forEach(function (btn) {
      btn.classList.remove('btn-animate');

      if (btn.dataset.mobileAnimBound === '1') return;
      btn.dataset.mobileAnimBound = '1';

      btn.addEventListener('click', function () {
        try { btn.blur(); } catch (e) {}
      }, true);

      btn.addEventListener('touchend', function () {
        try { btn.blur(); } catch (e) {}
      }, { passive: true });
    });
  }

  function setCollapsedState(holder, btn, body, collapsed) {
    if (!holder || !btn || !body) return;

    holder.dataset.collapsed = collapsed ? '1' : '0';
    body.style.display = collapsed ? 'none' : '';
    btn.textContent = collapsed ? '펼치기 ▼' : '접기 ▲';
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  }

  function bindToggle(holder, btn, body, defaultCollapsed) {
    if (!holder || !btn || !body) return;

    const hasStored = holder.dataset.collapsed === '1' || holder.dataset.collapsed === '0';
    const initialCollapsed = hasStored ? holder.dataset.collapsed === '1' : defaultCollapsed;

    if (isMobileView()) {
      setCollapsedState(holder, btn, body, initialCollapsed);
    } else {
      holder.dataset.collapsed = '0';
      body.style.display = '';
      btn.textContent = '접기 ▲';
      btn.setAttribute('aria-expanded', 'true');
    }

    if (btn.dataset.toggleBound === '1') return;
    btn.dataset.toggleBound = '1';

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      if (!isMobileView()) return;

      const nextCollapsed = holder.dataset.collapsed !== '1';
      setCollapsedState(holder, btn, body, nextCollapsed);
    });
  }

  function ensureStaticCard(cardId, titleSelector, defaultCollapsed, bodySelector) {
    const card = document.getElementById(cardId);
    if (!card) return;

    const title = card.querySelector(titleSelector);
    if (!title) return;

    let btn = card.querySelector('.section-toggle-btn[data-owner="' + cardId + '"]');
    if (!btn) {
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'section-toggle-btn';
      btn.dataset.owner = cardId;
      btn.textContent = '접기 ▲';

      const host = (title.parentElement && title.parentElement !== card) ? title.parentElement : card;
      host.appendChild(btn);
    }

    let body = card.querySelector(':scope > .section-body');
    if (!body) {
      body = document.createElement('div');
      body.className = 'section-body';

      if (bodySelector) {
        const targets = Array.from(card.querySelectorAll(bodySelector)).filter(function (el) {
          return !el.closest('.section-body');
        });

        if (!targets.length) return;

        targets[0].parentNode.insertBefore(body, targets[0]);
        targets.forEach(function (el) {
          body.appendChild(el);
        });
      } else {
        const children = Array.from(card.childNodes);
        let started = false;

        children.forEach(function (node) {
          if (node === title) {
            started = true;
            return;
          }

          if (!started) return;
          if (node === btn) return;
          if (node.nodeType === 3 && !String(node.textContent || '').trim()) return;

          body.appendChild(node);
        });

        card.appendChild(body);
      }
    }

    bindToggle(card, btn, body, defaultCollapsed);
  }

  function ensureProductSections() {
    document.querySelectorAll('.product-info-group').forEach(function (group, idx) {
      const header = group.querySelector(':scope > .d-flex.justify-content-between.align-items-center.mb-3');
      if (!header) return;

      let right = header.querySelector('.product-header-actions');
      if (!right) {
        right = document.createElement('div');
        right.className = 'product-header-actions';

        while (header.children.length > 1) {
          right.appendChild(header.children[1]);
        }
        header.appendChild(right);
      }

      let btn = right.querySelector('.product-toggle-btn');
      if (!btn) {
        btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'product-toggle-btn';
        btn.textContent = '접기 ▲';
        right.insertBefore(btn, right.firstChild);
      }

      let body = group.querySelector(':scope > .product-info-body');
      if (!body) {
        body = document.createElement('div');
        body.className = 'product-info-body';

        const children = Array.from(group.childNodes);
        let started = false;

        children.forEach(function (node) {
          if (node === header) {
            started = true;
            return;
          }

          if (!started) return;
          if (node === body) return;
          if (node.nodeType === 3 && !String(node.textContent || '').trim()) return;

          body.appendChild(node);
        });

        group.appendChild(body);
      }

      body.id = 'product_info_body_' + (idx + 1);
      bindToggle(group, btn, body, false);
    });
  }

  function applyMobileActionLayout() {
    if (isMobileView()) {
      document.body.classList.add('mobile-fixed-actionbar');
    } else {
      document.body.classList.remove('mobile-fixed-actionbar');
    }
  }

  window.openMobilePreviewSection = function () {
    const card = document.getElementById('previewCard');
    if (!card) return;

    const btn = card.querySelector('.section-toggle-btn');
    const body = card.querySelector(':scope > .section-body');
    if (!btn || !body) return;

    setCollapsedState(card, btn, body, false);
  };

  function safelyPrepareMobileUI() {
    if (isPreparingMobileUI) return;
    isPreparingMobileUI = true;

    if (mobileUiObserver) {
      mobileUiObserver.disconnect();
    }

    try {
      applyMobileActionLayout();
      ensureStaticCard('business_info', '.card-title', false);
      ensureStaticCard('customer_info', '.card-title', false);
      ensureStaticCard('specialNoteCard', '.card-title', false, '#special_note');
      ensureStaticCard('previewCard', '.card-title', true, '#previewBox');
      ensureProductSections();
      stripMobileButtonAnimation(document);
    } finally {
      isPreparingMobileUI = false;

      if (mobileUiObserver) {
        mobileUiObserver.observe(document.body, {
          childList: true,
          subtree: true
        });
      }
    }
  }

  window.prepareMobileSectionUI = safelyPrepareMobileUI;

  document.addEventListener('DOMContentLoaded', function () {
    mobileUiObserver = new MutationObserver(function (mutations) {
      if (!isMobileView()) return;
      if (isPreparingMobileUI) return;

      let shouldRefresh = false;

      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(function (node) {
          if (!(node instanceof Element)) return;

          if (
            node.matches('.product-info-group, .btn-animate, .customer_address_group') ||
            node.querySelector('.product-info-group, .btn-animate, .customer_address_group')
          ) {
            shouldRefresh = true;
          }
        });
      });

      if (shouldRefresh) {
        safelyPrepareMobileUI();
      }
    });

    safelyPrepareMobileUI();

    setTimeout(function () {
      safelyPrepareMobileUI();
    }, 0);

    mobileUiObserver.observe(document.body, {
      childList: true,
      subtree: true
    });

    window.addEventListener('resize', function () {
      safelyPrepareMobileUI();
    });

    window.addEventListener('load', function () {
      safelyPrepareMobileUI();
    });
  });
})();
</script>
