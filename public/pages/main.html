<option value="청호">청호</option>
<option value="코웨이">코웨이</option>
<option value="SK">SK</option>
<option value="쿠쿠">쿠쿠</option>

                    <div class="mb-3 row align-items-center">

<div id="business_info" class="card-box" style="display: none;">

                    <div class="mb-3 row align-items-center">
                        <label for="business_name" class="col-sm-3 col-form-label">상호명</label>
                        <div class="col-sm-9">
                            <input type="text" id="business_name" name="business_name" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3 row align-items-center">
                        <label for="business_number" class="col-sm-3 col-form-label">사업자번호</label>
                        <div class="col-sm-9">
                            <input type="text" id="business_number" name="business_number" class="form-control" oninput="formatBusinessNumber()">

                    </div>

                    <div class="mb-3 row align-items-center">

                                <input type="text" id="email_id" name="email_id" class="form-control" placeholder="카드 결제시 입력 불필요">

                                    <option value="daum.net">다음</option>

                        </div>
                    </div>
                </div>


<div id="customer_info" class="card-box position-relative">

                                            <img src="./assets/webimage/button/search.png" alt="" class="btn-inline-icon">
                                            <span>주소검색</span>
                                        </span>
                                    </button>
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control customer_address_normal" placeholder="설치 기본주소" required />

                                </div>

                        </div>
                    </div>
                </div>

    <!-- ✅ 중앙 영역 -->

                                            <input class="form-check-input promotion-request promotion-request-no" type="radio" name="promotion_request_1" value="없음" id="promotion_request_no_1" required>
                                            <label class="form-check-label" for="promotion_request_no_1">없음</label>
                                        </div>
                                    </div>
                                    <input type="text" class="form-control mt-2 promotion-text" name="promotion_text[]" placeholder="ex)3개월 반값, 6개월 면제" style="display: none;">
                                    <div class="form-text promotion-guide" style="display: none;"></div>
                                </div>

                            <div class="mb-3 row align-items-center">

                                        >?</span>
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input hard-construction" type="checkbox" name="hard_construction[]" id="hardConstruction" disabled>

                                            data-bs-custom-class="wide-tooltip"

                                        </label>
                                    </div>
                                    <div class="form-check">

                                    </div>

                                    <div class="w-100"></div>

                                    <div class="form-check">
                                        <input class="form-check-input product-collect" type="checkbox" name="product_collect[]" id="productCollect">
                                        <label class="form-check-label text-danger fw-bold" for="productCollect">기존 제품 수거</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input self-receipt" type="checkbox" name="self_receipt[]" id="selfReceipt" disabled>
                                        <label class="form-check-label text-muted" for="selfReceipt">자체접수</label>
                                    </div>
                                </div>
                            </div>

                            <div class="other-company-extra mt-3" style="display: none; border: 1px solid #ccc; padding: 15px; border-radius: 10px;">
                                <div class="mb-3">

                                    <select class="form-select other-brand" name="other_brand[]">
                                        <option value="">선택하세요</option>

<div class="main-action-row main-action-row--submit">
    <button type="button" id="resetBtn" class="btn btn-secondary btn-animate">
        <span class="btn-inline-icon-wrap">
            <img src="./assets/webimage/button/reset.png" alt="" class="btn-inline-icon">

        </span>
    </button>

    <div class="main-action-divider" aria-hidden="true"></div>

            <img src="./assets/webimage/button/load.png" alt="" class="btn-inline-icon">

        </span>
    </button>

    <div class="main-action-divider" aria-hidden="true"></div>

    <button type="button" id="saveTempBtn" class="btn btn-pink btn-animate" data-source="저장">

<script>
let worksheetData = [];

const CUSTOMER_APPLY_PREFILL = [];
const HAS_CUSTOMER_APPLY_PREFILL = false;

const CRM_PYTHON_PREFILL = {"source":"crm_python","brand":"","product_name":"","model_name":"","regulation":"","contract_period":"","management_cycle":"","rental_fee":"","customer_type":"","customer_name":"","birth_info":"","contact":"","payment_info":""};
const HAS_CRM_PYTHON_PREFILL = false;

let CRM_HASH_PREFILL_CACHE = null;
let CRM_HASH_PREFILL_READ = false;
let CRM_PYTHON_PREFILL_ACTIVE = false;
let CRM_PYTHON_CUSTOMER_PREFILL_DONE = false;
let CRM_PYTHON_PRODUCT_PREFILL_DONE = false;
window.crmPythonPrefillStage = '';

function readCrmPythonPrefillFromHash() {
    if (CRM_HASH_PREFILL_READ) {
        return CRM_HASH_PREFILL_CACHE;
    }

    CRM_HASH_PREFILL_READ = true;

    const hash = window.location.hash || '';
    const marker = '#crm_prefill=';

    if (!hash.startsWith(marker)) {
        return null;
    }

    let encoded = hash.slice(marker.length).trim();

    if (!encoded) {
        return null;
    }

    try {
        encoded = decodeURIComponent(encoded);
    } catch (e) {
        // base64url 값이면 decodeURIComponent가 필요 없을 수 있으므로 무시
    }

    try {
        let normalized = encoded.replace(/-/g, '+').replace(/_/g, '/');

        while (normalized.length % 4 !== 0) {
            normalized += '=';
        }

        const binary = window.atob(normalized);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        let jsonText = '';

        if (window.TextDecoder) {
            jsonText = new TextDecoder('utf-8').decode(bytes);
        } else {
            jsonText = decodeURIComponent(escape(binary));
        }

        const parsed = JSON.parse(jsonText);

        if (!parsed || parsed.source !== 'crm_python') {
            return null;
        }

        CRM_HASH_PREFILL_CACHE = parsed;

        // 주소창에 개인정보 hash가 남지 않도록 자동입력용 데이터 읽은 직후 제거
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }

        return CRM_HASH_PREFILL_CACHE;
    } catch (e) {
        console.error('CRM hash prefill decode failed:', e);
        return null;
    }
}

function getActiveCrmPythonPrefill() {
    const hashData = readCrmPythonPrefillFromHash();

    if (hashData && hashData.source === 'crm_python') {
        CRM_PYTHON_PREFILL_ACTIVE = true;
        return hashData;
    }

    if (HAS_CRM_PYTHON_PREFILL && CRM_PYTHON_PREFILL && CRM_PYTHON_PREFILL.source === 'crm_python') {
        CRM_PYTHON_PREFILL_ACTIVE = true;
        return CRM_PYTHON_PREFILL;
    }

    return null;
}

function isCrmPythonPrefillActive() {
    if (CRM_PYTHON_PREFILL_ACTIVE) {
        return true;
    }

    const data = getActiveCrmPythonPrefill();
    return !!(data && data.source === 'crm_python');
}

function crmPrefillBrandOnly(value) {
    const raw = caPrefillValue(value);

    if (!raw) {
        return '';
    }

    const firstPart = raw.split(/[-–—]/)[0].trim();

    return firstPart || raw;
}

function crmPrefillCanonicalBrand(value) {
    const brandOnly = crmPrefillBrandOnly(value);
    const normalized = brandOnly.replace(/\s|-/g, '').trim().toLowerCase();

    const brandMap = {
        '청호': '청호',
        '청호나이스': '청호',
        '코웨이': '코웨이',
        'coway': '코웨이',
        'sk': 'SK',
        'sk매직': 'SK',
        'skmagic': 'SK',
        'lg': 'LG',
        'lge': 'LG',
        '쿠쿠': '쿠쿠',
        'cuckoo': '쿠쿠',
        '웰스': '웰스',
        '교원웰스': '웰스',
        '현대': '현대',
        '현대렌탈케어': '현대',
        '세스코': '세스코'
    };

    return brandMap[normalized] || brandOnly;
}

function crmPrefillNormalizeBrand(value) {
    return caPrefillNormalize(crmPrefillCanonicalBrand(value));
}

function crmPrefillSetBrand(brandValue) {
    caPrefillSetBrand(crmPrefillCanonicalBrand(brandValue));
}

function crmPrefillIsCowayCompensation(data) {
    if (!data || data.source !== 'crm_python') {
        return false;
    }

    return crmPrefillNormalizeBrand(data.brand) === caPrefillNormalize('코웨이')
        && caPrefillValue(data.regulation).includes('보상');
}

function crmPrefillAutoCheckCowayOtherCompany(container, data) {
    if (!container || !container.length || !crmPrefillIsCowayCompensation(data)) {
        return;
    }

    const otherCompany = container.find('.other-company').first();
    if (!otherCompany.length) {
        return;
    }

    otherCompany.prop('disabled', false);
    otherCompany.prop('checked', true);
    otherCompany.trigger('change');

    const label = otherCompany.closest('.form-check').find('label');
    if (label.length) {
        label.removeClass('text-muted');
        label.addClass('text-danger fw-bold');
    }
}

function shouldAddCrmCowayCompensationNotice(productItem) {
    if (!productItem || !productItem.other_company_info) {
        return false;
    }

    const activeData = getActiveCrmPythonPrefill();
    const isEvergrowthUser = false;

    const isCoway = caPrefillNormalize(getSelectedBrandValue()) === caPrefillNormalize('코웨이')
        || crmPrefillNormalizeBrand(activeData?.brand) === caPrefillNormalize('코웨이');

    const regulationText = caPrefillValue(productItem.regulation || activeData?.regulation);
    const isCowayCompensation = isCoway && regulationText.includes('보상');

    if (!isCowayCompensation) {
        return false;
    }

    return isCrmPythonPrefillActive() || isEvergrowthUser;
}

const promotionHeaderMap = {
    '3년': '3년_프로모션',
    '4년': '4년_프로모션',
    '5년': '5년_프로모션',
    '6년': '6년_프로모션',
    '7년': '7년_프로모션',
    '9년': '9년_프로모션'
};

const contractColumnMap = {
    '3년': { contract: 6, management: 7, rentalFee: 8, commission: 9 },
    '4년': { contract: 10, management: 11, rentalFee: 12, commission: 13 },
    '5년': { contract: 14, management: 15, rentalFee: 16, commission: 17 },
    '6년': { contract: 18, management: 19, rentalFee: 20, commission: 21 },
    '7년': { contract: 22, management: 23, rentalFee: 24, commission: 25 },
    '8년': { contract: 30, management: 31, rentalFee: 32, commission: 33 },
    '9년': { contract: 34, management: 35, rentalFee: 36, commission: 37 }
};

function getSelectedBrandValue() {
    const brandSelectEl = document.getElementById("brand");
    const brandInputEl = document.getElementById("brand_input");

    const selectValue = (brandSelectEl?.value || "").trim();

    if (selectValue === "직접입력") {
        return (brandInputEl?.value || "").trim();
    }

    return selectValue;
}

function getWorksheetHeaders() {
    return Array.isArray(worksheetData) && Array.isArray(worksheetData[0]) ? worksheetData[0] : [];
}

function findWorksheetHeaderIndex(headerName) {
    return getWorksheetHeaders().findIndex(h => String(h ?? '').trim() === headerName);
}

function normalizeCompareText(v) {
    return String(v ?? '').replace(/\s|-/g, '').trim();
}

function normalizeMoneyValue(v) {
    return String(v ?? '').replace(/[^0-9]/g, '');
}

function extractContractYear(contractValue) {
    const match = String(contractValue ?? '').match(/(3년|4년|5년|6년|7년|8년|9년)/);
    return match ? match[1] : '';
}

function parsePromotionCellValue(rawValue) {
    const raw = String(rawValue ?? '').trim();
    if (!raw) return [];

    const parts = raw
        .split(/\r?\n|\/|,|·|ㆍ/)
        .map(s => s.trim())
        .filter(Boolean);

    return [...new Set(parts.length ? parts : [raw])];
}

function isCowaySelectedBrand() {
    return normalizeCompareText(getSelectedBrandValue()) === normalizeCompareText('코웨이');
}

function resetPromotionField(container) {
    const promotionTextInput = container.find(".promotion-text");
    const promotionGuide = container.find(".promotion-guide");
    const selectedRequest = container.find(".promotion-request:checked").val() || '';

    promotionTextInput.val('');
    promotionTextInput.prop('readonly', false);

    if (selectedRequest === '있음') {
        promotionTextInput.show();
        promotionTextInput.prop('required', true);
    } else {
        promotionTextInput.hide();
        promotionTextInput.prop('required', false);
    }

    promotionGuide.hide().text('');
}

function findMatchedWorksheetRow(container) {
    const selectedBrand = getSelectedBrandValue();
    const product = container.find(".product").val().trim();
    const model = container.find(".model").val().trim();
    const regulation = container.find(".regulation").val().trim();
    const contract = container.find(".contract").val().trim();
    const management = container.find(".management").val().trim();
    const rentalFee = container.find(".rental-fee").val().trim();

    const yearKey = extractContractYear(contract);
    const pairInfo = contractColumnMap[yearKey];

    if (!selectedBrand || !product || !regulation || !contract || !management || !rentalFee || !pairInfo) {
        return null;
    }

    return worksheetData.find((row, index) => {
        if (index === 0) return false;

        const rowProduct = String(row[0] ?? '').trim();
        const rowModel = String(row[1] ?? '').trim();
        const rowBrand = normalizeCompareText(row[28] ?? '');
        const rowRegulation = String(row[5] ?? '').trim();
        const rowContract = String(row[pairInfo.contract] ?? '').trim();
        const rowManagement = String(row[pairInfo.management] ?? '').trim();
        const rowRentalFee = normalizeMoneyValue(row[pairInfo.rentalFee] ?? '');

        if (rowProduct !== product) return false;
        if (model && rowModel !== model) return false;
        if (rowBrand !== normalizeCompareText(selectedBrand)) return false;
        if (rowRegulation !== regulation) return false;
        if (rowContract !== contract) return false;
        if (rowManagement !== management) return false;
        if (rowRentalFee !== normalizeMoneyValue(rentalFee)) return false;

        return true;
    }) || null;
}

function getMatchedPromotionOptions(container) {
    const contract = container.find(".contract").val().trim();
    const yearKey = extractContractYear(contract);
    const headerName = promotionHeaderMap[yearKey];
    const matchedRow = findMatchedWorksheetRow(container);

    if (!headerName || !matchedRow) {
        return [];
    }

    const headerIdx = findWorksheetHeaderIndex(headerName);
    if (headerIdx < 0) {
        return [];
    }

    return parsePromotionCellValue(matchedRow[headerIdx] ?? '');
}

function updatePromotionAutocomplete(container, showAlert = false) {
    const promotionTextInput = container.find(".promotion-text");
    const promotionGuide = container.find(".promotion-guide");
    const promoYes = container.find(".promotion-request-yes");
    const promoNo = container.find(".promotion-request-no");
    let selectedRequest = container.find(".promotion-request:checked").val() || '';
    const sourceValues = getMatchedPromotionOptions(container);
    const isCoway = isCowaySelectedBrand();

    if (promotionTextInput.data("uiAutocomplete")) {
        promotionTextInput.autocomplete("destroy");
    }

    promotionTextInput.autocomplete({
        source: sourceValues,
        minLength: 0
    });

    promotionTextInput.off("focus.promotionAuto").on("focus.promotionAuto", function () {
        const latestSourceValues = getMatchedPromotionOptions(container);

        if ($(this).data("ui-autocomplete")) {
            $(this).autocomplete("option", "source", latestSourceValues);
            if (latestSourceValues.length > 0) {
                $(this).autocomplete("search", "");
            }
        }
    });

    promotionTextInput.prop('readonly', false);
    promotionGuide.hide().text('');
    promoYes.prop('disabled', false);

    if (isCoway) {
        if (sourceValues.length === 0) {
            promoYes.prop('disabled', true);

            if (selectedRequest === '있음') {
                if (showAlert) {
                    alert("코웨이=프로모션 있을 때만 선택 가능");
                }
                promoYes.prop('checked', false);
                promoNo.prop('checked', true);
                selectedRequest = '없음';
            }

            promotionTextInput.val('');
            promotionTextInput.hide();
            promotionTextInput.prop('required', false);
            promotionTextInput.prop('readonly', true);
            promotionTextInput.attr('placeholder', '선택 가능한 프로모션이 없습니다');

            promotionGuide.text("코웨이=프로모션 있을 때만 선택 가능").show();
            return;
        }

        const currentValue = promotionTextInput.val().trim();
        if (currentValue && !sourceValues.includes(currentValue)) {
            promotionTextInput.val('');
        }

        promotionTextInput.prop('readonly', true);
        promotionTextInput.attr('placeholder', '코웨이=목록에서만 선택 가능');

        if (selectedRequest === '있음') {
            promotionTextInput.show();
            promotionTextInput.prop('required', true);
        } else {
            promotionTextInput.hide();
            promotionTextInput.prop('required', false);
        }
        return;
    }

    promotionTextInput.attr('placeholder', 'ex)3개월 반값, 6개월 면제');

    if (selectedRequest === '있음') {
        promotionTextInput.show();
        promotionTextInput.prop('required', true);
    } else {
        promotionTextInput.hide();
        promotionTextInput.prop('required', false);
    }
}

function caPrefillValue(value) {
    return String(value ?? '').trim();
}

function caPrefillNormalize(value) {
    return String(value ?? '').replace(/\s|-/g, '').trim();
}

function caPrefillMoney(value) {
    return String(value ?? '').replace(/[^0-9]/g, '');
}

function caPrefillSetField(selector, value) {
    const el = document.querySelector(selector);

    if (el) {
        el.value = caPrefillValue(value);
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
    }
}

function caPrefillBuildBirthDate(data) {
    const birthRaw = caPrefillValue(data.birth_date);
    const genderRaw = caPrefillValue(data.gender);
    const digits = birthRaw.replace(/\D/g, '');

    if (!digits) {
        return '';
    }

    if (digits.length !== 8) {
        return '';
    }

    const fullYear = parseInt(digits.slice(0, 4), 10) || 0;
    const month = parseInt(digits.slice(4, 6), 10) || 0;
    const day = parseInt(digits.slice(6, 8), 10) || 0;
    const birthDateObj = new Date(fullYear, month - 1, day);

    if (
        birthDateObj.getFullYear() !== fullYear ||
        birthDateObj.getMonth() + 1 !== month ||
        birthDateObj.getDate() !== day
    ) {
        return '';
    }

    const yy = digits.slice(2, 4);
    const mm = digits.slice(4, 6);
    const dd = digits.slice(6, 8);

    const genderKey = genderRaw.toLowerCase();
    const isMale = ['남', '남자', '남성', 'm', 'male'].includes(genderKey);
    const isFemale = ['여', '여자', '여성', 'f', 'female'].includes(genderKey);

    if (!isMale && !isFemale) {
        return yy + mm + dd;
    }

    const suffix = fullYear >= 2000
        ? (isMale ? '3' : '4')
        : (isMale ? '1' : '2');

    return yy + mm + dd + '-' + suffix;
}

function caPrefillSetBrand(brandValue) {
    const brand = caPrefillValue(brandValue);
    const brandSelect = document.getElementById('brand');
    const brandInputBox = document.getElementById('brand_input_box');
    const brandInput = document.getElementById('brand_input');

    if (!brandSelect || !brandInputBox || !brandInput) {
        return;
    }

    const option = Array.from(brandSelect.options).find(opt => caPrefillNormalize(opt.value) === caPrefillNormalize(brand));

    if (option) {
        brandSelect.value = option.value;
        brandSelect.style.display = 'block';
        brandInputBox.style.display = 'none';
        brandInput.value = '';
    } else {
        brandSelect.value = '직접입력';
        brandSelect.style.display = 'none';
        brandInputBox.style.display = 'block';
        brandInput.value = brand;
    }

    brandSelect.dispatchEvent(new Event('change', { bubbles: true }));
}

function caPrefillFindMatchedWorksheetRow(data) {
    const brand = caPrefillValue(data.brand);
    const product = caPrefillValue(data.product_name);
    const model = caPrefillValue(data.model_name);
    const regulation = caPrefillValue(data.regulation);
    const contract = caPrefillValue(data.contract_period);
    const management = caPrefillValue(data.management_cycle);
    const rentalFee = caPrefillValue(data.rental_fee);

    const yearKey = extractContractYear(contract);
    const pairInfo = contractColumnMap[yearKey];

    if (!brand || !product || !regulation || !contract || !management || !rentalFee || !pairInfo) {
        return null;
    }

    return worksheetData.find((row, index) => {
        if (index === 0) return false;

        const rowProduct = String(row[0] ?? '').trim();
        const rowModel = String(row[1] ?? '').trim();
        const rowBrand = caPrefillNormalize(row[28] ?? '');
        const rowRegulation = String(row[5] ?? '').trim();
        const rowContract = String(row[pairInfo.contract] ?? '').trim();
        const rowManagement = String(row[pairInfo.management] ?? '').trim();
        const rowRentalFee = caPrefillMoney(row[pairInfo.rentalFee] ?? '');

        if (rowProduct !== product) return false;
        if (model && rowModel !== model) return false;
        if (rowBrand !== caPrefillNormalize(brand)) return false;
        if (rowRegulation !== regulation) return false;
        if (rowContract !== contract) return false;
        if (rowManagement !== management) return false;
        if (rowRentalFee !== caPrefillMoney(rentalFee)) return false;

        return true;
    }) || null;
}

function caPrefillPromotionOptionsFromRow(row, contractValue) {
    const yearKey = extractContractYear(contractValue);
    const headerName = promotionHeaderMap[yearKey];

    if (!headerName || !row) {
        return [];
    }

    const headerIdx = findWorksheetHeaderIndex(headerName);
    if (headerIdx < 0) {
        return [];
    }

    return parsePromotionCellValue(row[headerIdx] ?? '');
}

function caPrefillApplyProductInfo(container, data, matchedRow) {
    const product = caPrefillValue(data.product_name);
    const model = caPrefillValue(data.model_name);
    const color = caPrefillValue(data.color);
    const regulation = caPrefillValue(data.regulation);
    const contract = caPrefillValue(data.contract_period);
    const management = caPrefillValue(data.management_cycle);
    const rentalFee = caPrefillValue(data.rental_fee);
    const promotionText = caPrefillValue(data.promotion_text);

    // ✅ 수수료율: 상담에서 전달받았으면 사용, 없으면 worksheet에서 찾기
    let commissionRate = parseFloat(data.commission_rate) || 0.90;
    if (matchedRow && worksheetData && worksheetData[0]) {
        const yearKey = extractContractYear(contract);
        const pairInfo = contractColumnMap[yearKey];
        if (pairInfo && pairInfo.commission !== undefined && matchedRow[pairInfo.commission]) {
            const commStr = String(matchedRow[pairInfo.commission]).replace(/[^0-9.]/g, '');
            if (commStr) commissionRate = parseFloat(commStr);
        }
    }
    // ✅ 수수료율을 hidden 필드에 저장 (저장 시 productObj에 포함)
    if (!container.find('.commission-rate').length) {
        container.append('<input type="hidden" class="commission-rate" name="commission_rate">');
    }

    container.find('.product').val(product);
    updateModelName(container, product);
    container.find('.model').val(model);
    container.find('.color').val(color);

    updateRegulationAutocomplete(container, product);
    container.find('.regulation').val(regulation);

    updateContractAutocomplete(container, product, regulation);
    container.find('.contract').val(contract);

    updateManagementAutocomplete(container, product, regulation, contract);
    container.find('.management').val(management);

    updateRentalFeeAutocomplete(container, product, regulation, contract, management);
    container.find('.rental-fee').val(rentalFee);
    container.find('.commission-rate').val(commissionRate);

    const promoYes = container.find('.promotion-request-yes');
    const promoNo = container.find('.promotion-request-no');
    const promoText = container.find('.promotion-text');

    let note = '';

    if (!promotionText) {
        promoYes.prop('checked', false);
        promoNo.prop('checked', true);
        promoText.val('').hide().prop('required', false);
        updatePromotionAutocomplete(container);
        return note;
    }

    if (caPrefillNormalize(data.brand) === caPrefillNormalize('코웨이')) {
        const options = caPrefillPromotionOptionsFromRow(matchedRow, contract);

        if (options.includes(promotionText)) {
            promoYes.prop('checked', true);
            promoNo.prop('checked', false);
            promoText.val(promotionText).show().prop('required', true);
            updatePromotionAutocomplete(container);
        } else {
            promoYes.prop('checked', false);
            promoNo.prop('checked', true);
            promoText.val('').hide().prop('required', false);
            updatePromotionAutocomplete(container);
            note = caPrefillPromotionMismatchNote(data);
        }

        return note;
    }

    promoYes.prop('checked', true);
    promoNo.prop('checked', false);
    promoText.val(promotionText).show().prop('required', true);
    updatePromotionAutocomplete(container);

    return note;
}

function crmPrefillFindBrandProductRows(data) {
    const brand = crmPrefillNormalizeBrand(data.brand);
    const product = caPrefillValue(data.product_name);

    if (!brand || !product) {
        return [];
    }

    return worksheetData.filter((row, index) => {
        if (index === 0) return false;
        return String(row[0] ?? '').trim() === product
            && caPrefillNormalize(row[28] ?? '') === brand;
    });
}

function crmPrefillFindContractPair(row, contractValue) {
    const contract = caPrefillValue(contractValue);

    if (!contract) {
        return null;
    }

    for (const key of Object.keys(contractColumnMap)) {
        const pairInfo = contractColumnMap[key];
        if (String(row[pairInfo.contract] ?? '').trim() === contract) {
            return pairInfo;
        }
    }

    return null;
}

function crmPrefillApplyProductByStage(container, data) {
    crmPrefillResetProductInfo(container);

    const product = caPrefillValue(data.product_name);
    const model = caPrefillValue(data.model_name);
    const regulation = caPrefillValue(data.regulation);
    const contract = caPrefillValue(data.contract_period);
    const management = caPrefillValue(data.management_cycle);
    const rentalFee = caPrefillValue(data.rental_fee);

    const productRows = crmPrefillFindBrandProductRows(data);
    if (!product || productRows.length === 0) {
        return;
    }

    const productRow = productRows.find(row => String(row[1] ?? '').trim() === model) || productRows[0];
    container.find('.product').val(product);
    container.find('.model').val(String(productRow[1] ?? '').trim());
    updateRegulationAutocomplete(container, product);

    if (!regulation) {
        updatePromotionAutocomplete(container);
        return;
    }

    const regulationRows = productRows.filter(row => String(row[5] ?? '').trim() === regulation);
    if (regulationRows.length === 0) {
        updatePromotionAutocomplete(container);
        return;
    }

    container.find('.regulation').val(regulation);
    updateContractAutocomplete(container, product, regulation);

    if (!contract) {
        updatePromotionAutocomplete(container);
        return;
    }

    const contractMatches = [];
    regulationRows.forEach(row => {
        const pairInfo = crmPrefillFindContractPair(row, contract);
        if (pairInfo) {
            contractMatches.push({ row, pairInfo });
        }
    });

    if (contractMatches.length === 0) {
        updatePromotionAutocomplete(container);
        return;
    }

    container.find('.contract').val(contract);
    updateManagementAutocomplete(container, product, regulation, contract);

    if (!management) {
        updatePromotionAutocomplete(container);
        return;
    }

    const managementMatches = contractMatches.filter(item => {
        return String(item.row[item.pairInfo.management] ?? '').trim() === management;
    });

    if (managementMatches.length === 0) {
        updatePromotionAutocomplete(container);
        return;
    }

    container.find('.management').val(management);
    updateRentalFeeAutocomplete(container, product, regulation, contract, management);

    if (!rentalFee) {
        updatePromotionAutocomplete(container);
        return;
    }

    const rentalMatches = managementMatches.filter(item => {
        return caPrefillMoney(item.row[item.pairInfo.rentalFee] ?? '') === caPrefillMoney(rentalFee);
    });

    if (rentalMatches.length === 0) {
        updatePromotionAutocomplete(container);
        return;
    }

    container.find('.rental-fee').val(rentalFee);
    updatePromotionAutocomplete(container);
}

// 상품명 autocomplete
function initializeProductAutocomplete(target) {
    const $targetInput = target ? $(target) : $(".product");

    $targetInput.each(function () {
        const $input = $(this);
        if ($input.hasClass('ui-autocomplete-input')) return;

        $input.autocomplete({
            source: function(request, response) {
                const selectedBrand = getSelectedBrandValue();
                const term = request.term.toLowerCase().replace(/\s|-/g, '');

                const filtered = worksheetData.filter((row, index) => {
                    if (index === 0) return false;
                    const brandName = row[28] || '';
                    return brandName.replace(/\s|-/g, '') === selectedBrand.replace(/\s|-/g, '');
                });

                const searchList = filtered.map(row => ({
                    label: row[0],
                    value: row[0],
                    searchable: (row[0] + ' ' + row[1]).toLowerCase().replace(/\s|-/g, '')
                }));

                const uniqueList = [...new Map(searchList.map(item => [item.label, item])).values()];
                const finalList = uniqueList.filter(item => item.searchable.includes(term));

                response(finalList);
            },
            minLength: 0,
            select: function(event, ui) {
                const $self = $(this);
                $self.val(ui.item.value);
                const container = $self.closest(".product-info-group");

                container.find(".model").val('');
                container.find(".regulation").val('');
                container.find(".contract").val('');
                container.find(".management").val('');
                container.find(".rental-fee").val('');
                resetPromotionField(container);

                updateModelName(container, ui.item.value);
                updateRegulationAutocomplete(container, ui.item.value);
                return false;
            }
        });

        $input.on("focus", function () {
            if ($(this).data("ui-autocomplete")) {
                $(this).autocomplete("search", "");
            }
        });
    });
}
function initializeAllAutocompletes($group) {
    const $productInput = $group.find(".product");

    initializeProductAutocomplete($productInput);

    const selectedProduct = $productInput.val().trim();
    if (selectedProduct) {
        updateModelName($group, selectedProduct);
        updateRegulationAutocomplete($group, selectedProduct);

        const selectedReg = $group.find(".regulation").val().trim();
        if (selectedReg) {
            updateContractAutocomplete($group, selectedProduct, selectedReg);

            const selectedContract = $group.find(".contract").val().trim();
            if (selectedContract) {
                updateManagementAutocomplete($group, selectedProduct, selectedReg, selectedContract);

                const selectedMgmt = $group.find(".management").val().trim();
                if (selectedMgmt) {
                    updateRentalFeeAutocomplete($group, selectedProduct, selectedReg, selectedContract, selectedMgmt);
                }
            }

                // 설치 또는 제조년월 자동 정제 (모든 .install-year 클래스 대상)
$(document).on('input', '.install-year', function (e) {
    const raw = e.target.value;
    const digits = raw.replace(/\D/g, '').slice(0, 6);
    let formatted = '';
    let cursor = e.target.selectionStart;

    // 현재 커서 위치에서 하이픈이 생기는 시점 이후면 커서 보정 필요
    if (digits.length === 4) {
        formatted = digits.slice(0, 2) + '-' + digits.slice(2, 4);
        if (cursor > 2) cursor++;  // 첫 하이픈 위치 보정
    } else if (digits.length === 6) {
        formatted = digits.slice(0, 4) + '-' + digits.slice(4, 6);
        if (cursor > 4) cursor++;  // 두 번째 하이픈 위치 보정
    } else {
        formatted = digits;
    }

    e.target.value = formatted;

    // 커서 위치가 문자열 길이를 초과하지 않도록 보정
    const safeCursor = Math.min(cursor, formatted.length);
    e.target.setSelectionRange(safeCursor, safeCursor);
});

                
                // 물마크 번호: 숫자만 허용 + 유효성 검사 (클래스로 모두 적용)
$(document).on('input', '.watermark-number', function (e) {
    let value = e.target.value;
    let cleaned = value.replace(/\D/g, '').slice(0, 8);

    // 커서 위치 계산
    const cursor = e.target.selectionStart;
    const diff = value.length - cleaned.length;
    const newCursor = Math.max(cursor - diff, 0);

    e.target.value = cleaned;
    e.target.setSelectionRange(newCursor, newCursor);
});

$(document).on('blur', '.watermark-number', function (e) {
    const value = e.target.value.trim();

        setTimeout(() => {
            e.target.focus();
        }, 10);
    }
});

                { inputClass: ".product-collect", baseId: "productCollect" },

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector("form");
    let isMainSaveSubmitBusy = false;

    function setSaveSubmitBusy(activeButton, source, busy) {
        const saveBtn = document.getElementById("saveTempBtn");
        const submitBtn = document.getElementById("submitBtn");
        const buttons = [saveBtn, submitBtn].filter(Boolean);

        if (busy) {
            isMainSaveSubmitBusy = true;

            buttons.forEach(btn => {
                if (!btn.dataset.originalHtml) {
                    btn.dataset.originalHtml = btn.innerHTML;
                }
                btn.disabled = true;
                btn.classList.add("disabled");
                btn.setAttribute("aria-disabled", "true");
            });

            if (activeButton) {
                activeButton.innerHTML =
                    `<span class="btn-inline-icon-wrap"><span>${source === "접수" ? "접수 중..." : "저장 중..."}</span></span>`;
            }
        } else {
            isMainSaveSubmitBusy = false;

            buttons.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove("disabled");
                btn.removeAttribute("aria-disabled");

                if (btn.dataset.originalHtml) {
                    btn.innerHTML = btn.dataset.originalHtml;
                }
            });
        }
    }

    async function copyPreviewTextSafely(text) {
        const value = String(text ?? "");
        if (!value) return false;

        if (navigator.clipboard && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(value);
                return true;
            } catch (err) {
                console.warn("navigator.clipboard 복사 실패, fallback 시도:", err);
            }
        }

        try {
            const previewBox = document.getElementById("previewBox");
            if (previewBox) {
                previewBox.focus({ preventScroll: true });
                previewBox.value = value;
                previewBox.select();
                previewBox.setSelectionRange(0, value.length);

                if (document.execCommand("copy")) {
                    return true;
                }
            }
        } catch (err) {
            console.warn("previewBox fallback 복사 실패:", err);
        }

        try {
            const temp = document.createElement("textarea");
            temp.value = value;
            temp.setAttribute("readonly", "readonly");
            temp.style.position = "fixed";
            temp.style.left = "-9999px";
            temp.style.top = "0";
            document.body.appendChild(temp);
            temp.focus();
            temp.select();

            const copied = document.execCommand("copy");
            document.body.removeChild(temp);

            return !!copied;
        } catch (err) {
            console.warn("textarea fallback 복사 실패:", err);
            return false;
        }
    }

    async function handleSaveOrSubmit(event) {
    if (isMainSaveSubmitBusy) {
        return;
    }

    const actionButton = event.currentTarget;

    if (window.openMobilePreviewSection) {
        window.openMobilePreviewSection();
    }

    // ✅ 모바일에서도 명확히 보이도록 프로모션 선택 여부를 먼저 직접 검사
    const promotionGroups = form.querySelectorAll(".product-info-group");

    for (let i = 0; i < promotionGroups.length; i++) {
        const group = promotionGroups[i];
        const checkedPromotion = group.querySelector(".promotion-request:checked");

        if (!checkedPromotion) {
            const firstPromotionRadio =
                group.querySelector(".promotion-request-yes") ||
                group.querySelector(".promotion-request-no");

            if (firstPromotionRadio) {
                firstPromotionRadio.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                setTimeout(() => {
                    firstPromotionRadio.focus();
                }, 50);
            }

            alert(`제품정보${i + 1}의 프로모션을 선택해주세요.\n\n"있음" 또는 "없음" 중 하나를 꼭 선택해야 합니다.`);
            return;
        }
    }

    // ✅ 필수 항목 검수
    if (!form.checkValidity()) {
        form.reportValidity(); // 브라우저가 빨간 테두리 + 안내 메시지 보여줌
        return; // ⛔ 복사 및 미리보기 중단
    }

    // ✅ 어떤 버튼(저장/접수)인지 먼저 판단
    const _source = event.currentTarget.dataset.source || '저장';

    // ✅ 접수 버튼일 때만 "예/아니오" 확인창 + 상세정보 표시
    if (_source === '접수') {
        const nameV  = (document.querySelector("[name='customer_name']")?.value || "").trim();

        const brandV = (document.getElementById("brand_input")?.value || "").trim()
                    || (document.getElementById("brand")?.selectedOptions?.[0]?.text || "").trim();

        const prodV  = (document.querySelector(".product-info-group .product")?.value || "").trim();

        const msg =
            `접수를 진행하시겠습니까?\n\n` +
            `브랜드: ${brandV}\n` +
            `고객명: ${nameV}\n` +
            `상품명: ${prodV}`;

        const ok = confirm(msg);
        if (!ok) return; // ❌ 아니오면 아무것도 안 함(중단)
    }

    const getVal = id => document.getElementById(id)?.value?.trim() || "";
    const getSel = id => {
        const el = document.getElementById(id);
        if (!el) return "";
        const selected = el.selectedOptions?.[0]?.text || "";
        return (selected === "선택하세요") ? "" : selected;
    };

    const today = new Date();
    const yyyy = today.getFullYear().toString().slice(2);
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const yymmdd = `${yyyy}${mm}${dd}`;

    const brand = getVal("brand_input") || getSel("brand");
    const customerType = getSel("customer_type");

    const isBusiness = ["개인사업자", "법인사업자"].includes(getSel("customer_type"));

    const businessName = isBusiness ? getVal("business_name") : "";
    const businessNumber = isBusiness ? getVal("business_number") : "";
    const corporationNumber = isBusiness ? getVal("corporation_number") : "";

    const emailId = isBusiness ? getVal("email_id") : "";
    const emailDomain = isBusiness ? getVal("email_domain") : "";
    const email = (emailId && emailDomain) ? `${emailId}@${emailDomain}` : "";

    const name = document.querySelector("[name='customer_name']")?.value.trim() || "";
    const birth = getVal("birth_date");
    const contact = getVal("contact");
    const payment = document.querySelector("[name='payment_info']")?.value.trim() || "";

    const addresses = [];
    document.querySelectorAll(".customer_address_group").forEach(group => {
    const zip    = (group.querySelector(".customer_zipcode")?.value || "").trim();
    const basic  = (group.querySelector(".customer_address_normal")?.value || "").trim();
    const detail = (group.querySelector(".customer_address_detail")?.value || "").trim();
    if (zip || basic || detail) {
        addresses.push({ zip, basic, detail });   // ← 객체로 저장
    }
    });

    // 미리보기 텍스트는 보기 좋게 다시 조합
    const addressLines = addresses.map(a =>
    `[${a.zip || ''}] ${[a.basic, a.detail].filter(Boolean).join(' ')}`.trim()
    );
    const addressBlock = addressLines.length ? addressLines.join("\n") + '\n------------------------------' : "";

    const products = [];
    const productGroups = document.querySelectorAll(".product-info-group");

    for (let idx = 0; idx < productGroups.length; idx++) {
        const group = productGroups[idx];

        const product = group.querySelector(".product")?.value || "";
        const model = group.querySelector(".model")?.value || "";
        const color = group.querySelector(".color")?.value || "";
        const reg = group.querySelector(".regulation")?.value || "";
        const contract = group.querySelector(".contract")?.value || "";
        const manage = group.querySelector(".management")?.value || "";
        const fee = group.querySelector(".rental-fee")?.value || "";

        const promotionRequest = group.querySelector(".promotion-request:checked")?.value || "";
        const promotionTextEl = group.querySelector(".promotion-text");
        const promo = promotionRequest === "있음" ? (promotionTextEl?.value || "").trim() : "";

        if (promotionRequest === "있음" && promo === "") {
            alert(`제품정보${idx + 1}의 프로모션을 입력하거나 목록에서 선택해주세요.`);
            if (promotionTextEl) {
                promotionTextEl.style.display = "";
                promotionTextEl.required = true;
                promotionTextEl.focus();
            }
            return;
        }

        const preVisit = group.querySelector(".pre-visit")?.checked ? "사전답사" : "";
        const hardConstruction = group.querySelector(".hard-construction")?.checked ? "난공사 요청" : "";
        const productCollect = group.querySelector(".product-collect")?.checked ? "기존 제품 수거" : "";
        const selfReceipt = group.querySelector(".self-receipt")?.checked ? "자체접수" : "";

        let productType = "", productKind = "", installType = "", otherBrand = "", installYear = "", watermark = "", otherInfo = "";

        if (group.querySelector(".other-company")?.checked) {
            const otherSection = group.querySelector(".other-company-extra");

            otherBrand = otherSection?.querySelector(".other-brand")?.value || "";
            installYear = otherSection?.querySelector(".install-year")?.value || "";
            watermark = otherSection?.querySelector(".watermark-number")?.value?.trim() || "";

            productType = otherSection.querySelector(`input[name="product_type_${idx + 1}"]:checked`)?.value || "";
            productKind = otherSection.querySelector(`input[name="product_kind_${idx + 1}"]:checked`)?.value || "";
            installType = otherSection.querySelector(`input[name="install_type_${idx + 1}"]:checked`)?.value || "";

            const line1 = [otherBrand, installYear, productType, productKind, installType].filter(Boolean).join("/");
            const lines = [];

            if (line1 || watermark) {
                lines.push(`타사정보`);
                if (line1) lines.push(line1);
                if (watermark) lines.push(watermark);
                otherInfo = '\n' + lines.join("\n");
            }
        }

        const confirmLine = [preVisit, hardConstruction, productCollect, selfReceipt].filter(Boolean).join(", ");
        const productObj = {
            label: `제품정보${idx + 1}`,
            name: product,
            model,
            color,
            regulation: reg,
            contract,
            management: manage,
            promotion_request: promotionRequest || "없음",
            promotion: promo,
            rental_fee: fee,
            commission_rate: parseFloat(group.querySelector(".commission-rate")?.value || group.querySelector(".commission_rate")?.value) || 0.90,
            pre_visit: !!preVisit,
            hard_construction: !!hardConstruction,
            product_collect: !!productCollect,
            self_receipt: !!selfReceipt,
            other_company_info: group.querySelector(".other-company")?.checked ? {
                brand: otherBrand,
                install_year: installYear,
                watermark,
                type: productType,
                kind: productKind,
                install: installType
            } : null
        };
        products.push(productObj);
    }

    const productText = products.map(p => {
        const lines = [
            p.label,
            p.name,
            p.model,
            p.color,
            [p.regulation, p.contract, p.management].filter(Boolean).join("/"),
            p.promotion,
            p.rental_fee ? `${p.rental_fee}원` : "",
            p.pre_visit ? "사전답사" : "",
            p.hard_construction ? "난공사 요청" : "",
            p.self_receipt ? "자체접수" : ""
        ].filter(Boolean);

        if (p.other_company_info) {
            if (shouldAddCrmCowayCompensationNotice(p)) {
                lines.push(
                    "",
                    "★정말 정말 중요★",
                    "설치 방문시 현장에",
                    "타사정수기 필수로",
                    "있어야 할인가능!!",
                    ""
                );
            }

            const other = p.other_company_info;
            const line1 = [other.brand, other.install_year, other.type, other.kind, other.install].filter(Boolean).join("/");
            if (line1) lines.push("타사정보", line1);
            if (other.watermark) lines.push(other.watermark);
        }

        return lines.join("\n");
    }).join("\n\n");

    const specialNote = getVal("special_note");

    const collectNoteLines = products
        .map((p, idx) => p.product_collect ? `제품${idx + 1} : 기존 제품 수거` : "")
        .filter(Boolean);

    const collectNoteBlock = collectNoteLines.length ? collectNoteLines.join("\n") : "";

    const specialNoteWithDivider = `------------------------------\n특이사항\n${collectNoteBlock ? collectNoteBlock + "\n" : ""}${specialNote}`;

    const businessInfo = [businessName, businessNumber, corporationNumber, email].filter(v => v).join("\n");

    const previewText = 
`$${yymmdd}
${brand}
${customerType}

${businessInfo ? businessInfo + '\n\n' : ''}` +
(name ? name + '\n' : '') +
(birth ? birth + '\n' : '') +
(contact ? contact + '\n' : '') +
(payment ? payment + '\n' : '') +
(addressBlock ? addressBlock + '\n' : '') +
productText +
"\n" + specialNoteWithDivider;

document.getElementById("previewBox").value = previewText;

// ✅ 서버로 JSON 전송
const jsonToSave = {
    brand,
    customer_type: customerType,
    business_name: businessName,
    business_number: businessNumber,
    corporation_number: corporationNumber,
    email,
    customer_name: name,
    birth_date: birth,
    contact,
    payment_info: payment,
    addresses,
    products,
    special_note: specialNote
};

setSaveSubmitBusy(actionButton, _source, true);

try {
    const copySuccess = await copyPreviewTextSafely(previewText);
    const jsonText = JSON.stringify(jsonToSave);

    const res = await fetch("save_json.php?_source=" + encodeURIComponent(_source), {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Cache-Control": "no-cache"
        },
        body: jsonText,
        credentials: "same-origin",
        cache: "no-store"
    });

    const contentType = res.headers.get("content-type") || "";

    if (!res.ok) {
        const errorText = await res.text();
        console.error("❌ 서버 응답 (에러 포함):", errorText);
        throw new Error("서버 오류 (" + res.status + "):\n" + errorText);
    }

    if (!contentType.includes("application/json")) {
        const text = await res.text();
        console.error("⚠️ 서버에서 JSON 아닌 응답:", text);
        alert("⚠️ 서버에서 JSON이 아닌 응답을 받았습니다:\n" + text);
        return;
    }

    const data = await res.json();

    if (data.success) {
        if (_source === "접수") {
            const info = data.inserted || {};
            const copyNotice = copySuccess
                ? ""
                : "\n\n※ 자동 복사는 실패했습니다. 미리보기 내용을 수동으로 복사해주세요.";

            alert(
                `✅ 접수가 완료되었습니다!\n\n` +
                `브랜드: ${info.brand || brand}\n` +
                `고객명: ${info.customer_name || name}\n` +
                `연락처: ${info.contact || contact}\n` +
                `상품명: ${info.product_name || (products[0]?.name || "")}` +
                copyNotice
            );
        } else {
            if (copySuccess) {
                alert("내용이 복사되었습니다!");
            } else {
                alert("저장되었습니다.\n\n※ 자동 복사는 실패했습니다. 미리보기 내용을 수동으로 복사해주세요.");
            }
        }
    } else {
        alert("❌ 저장 실패: " + (data.error || data.message || "알 수 없는 오류"));
        console.error("🔍 서버 오류 응답:", data);
    }
} catch (err) {
    alert("⚠️ 저장 요청 실패:\n" + err.message);
    console.error("🧨 에러 상세:", err);
} finally {
    setSaveSubmitBusy(actionButton, _source, false);
}
}
document.getElementById("saveTempBtn").addEventListener("click", handleSaveOrSubmit);
document.getElementById("submitBtn").addEventListener("click", handleSaveOrSubmit);
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const currentUserId = (JSON.parse(localStorage.getItem("allrental_auth") || "{}").id || "admin"); // ✅ 현재 로그인한 사용자 ID
    document.getElementById("resetBtn").addEventListener("click", function () {
    if (confirm("모든 입력값을 초기화하시겠습니까?")) {
        window.location.href = 'main.php';
    }
    });


  // ✅ 오늘 ~ 7일 전 날짜 자동 설정
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const todayStr = `${yyyy}-${mm}-${dd}`;

  const sevenDaysAgo = new Date(today);
  sevenDaysAgo.setDate(today.getDate() - 6);
  const sevenDaysAgoStr = `${sevenDaysAgo.getFullYear()}-${String(sevenDaysAgo.getMonth() + 1).padStart(2, '0')}-${String(sevenDaysAgo.getDate()).padStart(2, '0')}`;

  document.getElementById("startDate").value = sevenDaysAgoStr;
  document.getElementById("endDate").value = todayStr;

  let allData = [];
  let showAll = true;
  let currentPage = 1;
  const rowsPerPage = 20;

  const showAllCheckbox = document.getElementById("showAllToggle");
if (showAllCheckbox) {
  showAllCheckbox.addEventListener("change", function () {
    showAll = this.checked;
    currentPage = 1;
    showFilteredData();
  });
}

  document.getElementById("loadTempBtn").addEventListener("click", function () {
    const listUrl = "fetch_saved_list.php?_=" + Date.now();

    fetch(listUrl, {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache"
      }
    })
      .then(async res => {
        if (!res.ok) {
          const errorText = await res.text();
          throw new Error("서버 오류 (" + res.status + "): " + errorText);
        }

        return res.json();
      })
      .then(data => {
        if (!Array.isArray(data)) {
          throw new Error(data?.error || "저장 리스트 응답 형식이 올바르지 않습니다.");
        }

        allData = data;
        currentPage = 1;
        showFilteredData();
      })
      .catch(err => {
        console.error("불러오기 실패:", err);
        alert("저장 리스트 불러오기 중 오류가 발생했습니다.");
      });
  });

  document.getElementById("filterBtn").addEventListener("click", () => {
    currentPage = 1;
    showFilteredData();
  });
  document.getElementById("searchKeyword").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      currentPage = 1;
      showFilteredData();
    }
  });

    function showFilteredData() {
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;

    const keywordRaw = (document.getElementById("searchKeyword")?.value || "");
    const keyword = keywordRaw.trim();

    // ✅ null/undefined 안전 정규화
    const normalize = (v) => String(v ?? "").replace(/[\s\-\/]/g, "").toLowerCase();

    const keywordNorm = normalize(keyword);

    const filtered = allData.filter(row => {
        const createdAt = String(row?.created_at ?? "");
        const date = createdAt.substring(0, 10);

        if (startDate && date < startDate) return false;
        if (endDate && date > endDate) return false;

        if (!showAll && String(row?.user_id ?? "") !== String(currentUserId ?? "")) return false;

        // ✅ 키워드가 있을 때만 필터
        if (keywordNorm) {
        const combined = [
            row?.customer_name,
            row?.contact,
            row?.birth_date,
            row?.brand,
            row?.user_id,        // ✅ 담당자 ID도 검색되게 추가
            row?.name_snapshot
        ].map(normalize).join("");

        if (!combined.includes(keywordNorm)) return false;
        }

        return true;
    });

    renderTable(filtered);
    renderPagination(filtered.length);

    const modalEl = document.getElementById("loadListModal");
    const existingModal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
    existingModal.show();
    }

  function renderTable(data) {
    const tbody = document.querySelector("#loadListTable tbody");
    const cardWrap = document.getElementById("loadListCardWrap");

    tbody.innerHTML = "";
    if (cardWrap) cardWrap.innerHTML = "";

    const startIdx = (currentPage - 1) * rowsPerPage;
    const paginated = data.slice(startIdx, startIdx + rowsPerPage);

    const esc = (v) => String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

    if (paginated.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="text-center text-muted">데이터가 없습니다.</td>
        </tr>
      `;

      if (cardWrap) {
        cardWrap.innerHTML = `<div class="text-muted small">데이터가 없습니다.</div>`;
      }
      return;
    }

    paginated.forEach((row, index) => {
      const managerText = `${row.user_id || ''}${row.name_snapshot ? ' / ' + row.name_snapshot : ''}`;
      const sourceText = row.source || '-';
      const sourceClass =
        sourceText === '저장'
          ? 'saved-source-badge--save'
          : sourceText === '접수'
            ? 'saved-source-badge--submit'
            : 'saved-source-badge--other';

      const safeCollapseId = `saved_detail_${String(row.id || '').replace(/[^a-zA-Z0-9_-]/g, '_')}_${index}`;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="display: none;">${esc(row.id)}</td>
        <td class="left-text">${esc(row.created_at)}</td>
        <td class="center-text">${esc(managerText)}</td>
        <td class="left-text">${esc(row.customer_name)}</td>
        <td class="left-text">${esc(row.contact)}</td>
        <td class="left-text">${esc(row.birth_date)}</td>
        <td class="center-text">${esc(row.brand)}</td>
        <td class="center-text">${esc(sourceText)}</td>
        <td class="center-text">
          <div class="d-inline-flex justify-content-center align-items-center gap-2">
            <button class="btn btn-sm btn-animate load-single" data-id="${esc(row.id)}">
              <span class="btn-inline-icon-wrap">
                <img src="./assets/webimage/button/load.png" alt="" class="btn-inline-icon">
                <span>불러오기</span>
              </span>
            </button>
            <button class="btn btn-sm btn-animate delete-single" data-id="${esc(row.id)}">
              <span class="btn-inline-icon-wrap">
                <img src="./assets/webimage/button/delete.png" alt="" class="btn-inline-icon">
                <span>삭제</span>
              </span>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);

      if (cardWrap) {
        const card = document.createElement("div");
        card.className = "saved-card";
        card.innerHTML = `
          <div class="saved-card-body">
            <div class="saved-card-top">
              <div class="saved-card-title">${esc(row.customer_name)}</div>
              <div class="saved-card-top-side">
                <button type="button"
                        class="btn btn-sm btn-animate saved-card-detail-btn"
                        data-bs-toggle="collapse"
                        data-bs-target="#${safeCollapseId}"
                        aria-expanded="false"
                        aria-controls="${safeCollapseId}">
                  <span class="btn-inline-icon-wrap">
                    <img src="./assets/webimage/button/detail.png" alt="" class="btn-inline-icon">
                    <span>상세</span>
                  </span>
                </button>
                <span class="saved-source-badge ${sourceClass}">${esc(sourceText)}</span>
              </div>
            </div>

            <div class="saved-card-meta">
              <div class="saved-card-meta-left">${esc(row.created_at)}</div>
              <div class="saved-card-meta-right">
                <span class="saved-manager-badge">${esc(managerText)}</span>
              </div>
            </div>

            <div class="saved-card-summary-row">
              <div class="saved-card-summary-chip">${esc(row.contact)}</div>
              <div class="saved-card-summary-chip">${esc(row.birth_date)}</div>
              <div class="saved-card-summary-chip">${esc(row.brand)}</div>
            </div>

            <div class="collapse mt-2" id="${safeCollapseId}">
              <div class="saved-card-detail-box">
                <div class="saved-card-actions">
                  <button class="btn btn-sm btn-animate load-single" data-id="${esc(row.id)}">
                    <span class="btn-inline-icon-wrap">
                      <img src="./assets/webimage/button/load.png" alt="" class="btn-inline-icon">
                      <span>불러오기</span>
                    </span>
                  </button>

                  <div class="saved-card-action-divider" aria-hidden="true"></div>

                  <button class="btn btn-sm btn-animate delete-single" data-id="${esc(row.id)}">
                    <span class="btn-inline-icon-wrap">
                      <img src="./assets/webimage/button/delete.png" alt="" class="btn-inline-icon">
                      <span>삭제</span>
                    </span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        cardWrap.appendChild(card);
      }
    });
  }

    function renderPagination(totalRows) {
    const pagination = document.getElementById("paginationArea");
    const jumpForm = document.getElementById("paginationJumpForm");
    const jumpInput = document.getElementById("paginationJumpInput");
    const statusText = document.getElementById("paginationStatusText");

    pagination.innerHTML = "";

    const totalPages = Math.ceil(totalRows / rowsPerPage);

    // ✅ 페이지가 1개 이하면 페이지네이션/점프 숨김(기존과 동일 효과)
    if (totalPages <= 1) {
        if (jumpForm) jumpForm.style.display = "none";
        if (statusText) statusText.textContent = "1 / 1";
        return;
    }

    // ✅ currentPage가 범위를 벗어나면 보정(필터 변경 시 방어)
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages;

    // ✅ 모바일에서는 숫자 범위를 줄여서 가로 스크롤 방지
    const isMobile = window.innerWidth <= 768;
    const around = isMobile ? 1 : 2;

    const createBtn = (label, page, { disabled = false, active = false } = {}) => {
        const li = document.createElement("li");
        li.className = "page-item" + (disabled ? " disabled" : "") + (active ? " active" : "");

        const a = document.createElement("a");
        a.className = "page-link";
        a.href = "#";
        a.textContent = label;

        a.addEventListener("click", function (e) {
        e.preventDefault();
        if (disabled || active) return;
        currentPage = page;
        showFilteredData();
        });

        li.appendChild(a);
        return li;
    };

    const createDots = () => {
        const li = document.createElement("li");
        li.className = "page-item disabled";
        li.innerHTML = `<span class="page-link">…</span>`;
        return li;
    };

    // « 맨앞 / ‹ 이전
    pagination.appendChild(createBtn("«", 1, { disabled: currentPage === 1 }));
    pagination.appendChild(createBtn("‹", Math.max(1, currentPage - 1), { disabled: currentPage === 1 }));

    // 숫자 범위 계산
    let start = Math.max(1, currentPage - around);
    let end = Math.min(totalPages, currentPage + around);

    // 1페이지는 항상 노출 + ...
    if (start > 1) {
        pagination.appendChild(createBtn("1", 1, { active: currentPage === 1 }));
        if (start > 2) pagination.appendChild(createDots());
    }

    for (let p = start; p <= end; p++) {
        pagination.appendChild(createBtn(String(p), p, { active: p === currentPage }));
    }

    // 마지막 페이지는 항상 노출 + ...
    if (end < totalPages) {
        if (end < totalPages - 1) pagination.appendChild(createDots());
        pagination.appendChild(createBtn(String(totalPages), totalPages, { active: currentPage === totalPages }));
    }

    // › 다음 / » 맨뒤
    pagination.appendChild(createBtn("›", Math.min(totalPages, currentPage + 1), { disabled: currentPage === totalPages }));
    pagination.appendChild(createBtn("»", totalPages, { disabled: currentPage === totalPages }));

    // ✅ 점프 UI 표시 + 상태 텍스트 갱신
    if (jumpForm) {
    jumpForm.style.display = "flex";
    jumpForm.dataset.totalPages = String(totalPages); // ✅ 필터 결과 기준 totalPages 저장
    }
    if (statusText) statusText.textContent = `${currentPage} / ${totalPages}`;

    if (jumpInput) {
        jumpInput.min = "1";
        jumpInput.max = String(totalPages);
        jumpInput.value = "";
    }
    }

(function bindPaginationJumpOnce() {
  const jumpForm = document.getElementById("paginationJumpForm");
  const jumpInput = document.getElementById("paginationJumpInput");
  if (!jumpForm || !jumpInput || jumpForm.dataset.bound === "1") return;

  jumpForm.dataset.bound = "1";

  jumpForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const totalPages = parseInt(jumpForm.dataset.totalPages || "1", 10) || 1;

    let p = parseInt((jumpInput.value || "").trim(), 10);
    if (!p || p < 1) p = 1;
    if (p > totalPages) p = totalPages;

    currentPage = p;
    showFilteredData();
  });
})();

  function fillFormWithData(rawData) {
  const brandSelect = document.getElementById("brand");
  const brandInputBox = document.getElementById("brand_input_box");
  const brandInput = document.getElementById("brand_input");

  if (["청호", "코웨이", "SK", "쿠쿠", "LG", "웰스", "현대", "세스코"].includes(rawData.brand)) {
    brandSelect.dataset.restoring = "true";
    brandSelect.value = rawData.brand;
    brandSelect.style.display = "block";
    brandInputBox.style.display = "none";
    brandSelect.dispatchEvent(new Event("change"));

    setTimeout(() => {
        const brand = brandSelect.value;
        const preList = document.querySelectorAll('.pre-visit');
        const hardList = document.querySelectorAll('.hard-construction');
        const otherList = document.querySelectorAll('.other-company');
        const collectList = document.querySelectorAll('.product-collect');
        const selfList = document.querySelectorAll('.self-receipt');

        // ✅ 체크박스 상태 복원 (rawData.products 기준)
        rawData.products.forEach((product, idx) => {
        if (preList[idx]) preList[idx].checked = !!product.pre_visit;
        if (hardList[idx]) hardList[idx].checked = !!product.hard_construction;
        if (otherList[idx]) otherList[idx].checked = !!product.other_company_info;
        if (collectList[idx]) collectList[idx].checked = !!product.product_collect;
        if (selfList[idx]) selfList[idx].checked = !!product.self_receipt;
        });

        // ✅ 모든 체크박스 비활성화 + 스타일 초기화
        // ✅ collectList(기존 제품 수거)는 항상 활성이라 제외
        [preList, hardList, otherList, selfList].forEach(list => {
        list.forEach(el => {
            el.disabled = true;
            const label = el.closest('.form-check')?.querySelector('label');
            if (label) {
            label.classList.remove('text-danger', 'fw-bold');
            label.classList.add('text-muted');
            }
        });
        });

        // ✅ collectList는 브랜드와 상관없이 항상 활성
        collectList.forEach(el => {
            el.disabled = false;
            const label = el.closest('.form-check')?.querySelector('label');
            if (label) {
                label.classList.remove('text-muted');
                label.classList.add('text-danger', 'fw-bold');
            }
        });

        // ✅ 브랜드별 활성화 및 강조
        if (brand === '청호') {
        preList.forEach(el => {
            el.disabled = false;
            const label = el.closest('.form-check')?.querySelector('label');
            if (label) {
            label.classList.remove('text-muted');
            label.classList.add('text-danger', 'fw-bold');
            }
        });
        } else if (brand === '코웨이') {
        [...hardList, ...otherList, ...selfList].forEach(el => {
            el.disabled = false;
            const label = el.closest('.form-check')?.querySelector('label');
            if (label) {
            label.classList.remove('text-muted');
            label.classList.add('text-danger', 'fw-bold');
            }
        });
        }

    delete brandSelect.dataset.restoring;
    }, 100);

  } else {
    brandSelect.value = "직접입력";
    brandSelect.style.display = "none";
    brandInputBox.style.display = "block";
    brandInput.value = rawData.brand;
  }

  // 고객유형
  document.getElementById("customer_type").value = rawData.customer_type;

  // 사업자 정보
  document.getElementById("business_name").value = rawData.business_name || "";
  document.getElementById("business_number").value = rawData.business_number || "";
  document.getElementById("corporation_number").value = rawData.corporation_number || "";

  // 이메일
  const emailParts = rawData.email?.split("@") || [];
  document.getElementById("email_id").value = emailParts[0] || "";
  document.getElementById("email_domain").value = emailParts[1] || "";

  // 고객 정보
  document.querySelector("[name='customer_name']").value = rawData.customer_name || "";
  document.getElementById("birth_date").value = rawData.birth_date || "";
  document.getElementById("contact").value = rawData.contact || "";
  document.querySelector("[name='payment_info']").value = rawData.payment_info || "";

// 주소 영역 초기화 (템플릿은 유지)
const addressWrap = document.getElementById("customer_address_wrap");
addressWrap.querySelectorAll(".customer_address_group:not(.customer_address_group_basic)").forEach(el => el.remove());

const baseGroup = $("#customer_address_wrap .customer_address_group_basic").first();
if (baseGroup.length === 0) {
  console.error("❌ .customer_address_group_basic 요소가 없습니다.");
  return;
}

(rawData.addresses || []).forEach((address, idx) => {
  let $group;

  // ✅ 첫 번째 주소는 템플릿 그대로 사용
  if (idx === 0) {
    $group = baseGroup;
  } else {
    // ✅ 두 번째 이후는 템플릿 복제
    $group = baseGroup.clone(true, true);
    $group.removeClass("customer_address_group_basic d-none").addClass("mt-3 customer_address_group");
    addressWrap.appendChild($group.get(0));
  }

  // ✅ 새 포맷(객체)과 구 포맷(문자열) 모두 처리
  let zip = "", basic = "", detail = "";

  if (address && typeof address === "object") {
    // { zip, basic, detail } 객체 저장분
    zip    = (address.zip    || "").trim();
    basic  = (address.basic  || "").trim();
    detail = (address.detail || "").trim();
  } else {
    // "[12345] 기본 상세" 문자열 저장분 (레거시)
    const str = String(address || "").trim();
    const zipMatch = str.match(/\[(\d{5})\]/);
    zip = zipMatch?.[1] || "";
    const rest = str.replace(/\[(\d{5})\]/, "").trim();

    // 참고항목이 괄호로 붙은 경우만 ')' 기준으로 분리
    if (rest.includes(')')) {
      const endIdx = rest.indexOf(')') + 1;
      basic  = rest.slice(0, endIdx).trim();
      detail = rest.slice(endIdx).trim();
    } else {
    // 🔁 레거시 문자열 호환: 마지막 공백 기준으로 상세주소 분리(없으면 전체를 기본주소로)
    const lastSpace = rest.lastIndexOf(' ');
    if (lastSpace > -1) {
        basic  = rest.slice(0, lastSpace).trim();
        detail = rest.slice(lastSpace + 1).trim();
    } else {
        basic  = rest;
        detail = "";
    }
    }
  }

  // DOM 채우기
  $group.find(".fw-bold").text("주소" + (idx + 1));
  $group.find(".customer_zipcode").val(zip);
  $group.find(".customer_address_normal").val(basic);
  $group.find(".customer_address_detail").val(detail);

  if (idx === 0) {
    $group.find(".customer_address_add").show();
  } else {
    $group.find(".customer_address_add").remove();
    const deleteBtn = $('<button type="button" class="btn btn-danger btn-sm ms-2 customer_address_remove btn-animate"><span class="btn-inline-icon-wrap"><img src="./assets/webimage/button/delete.png" alt="" class="btn-inline-icon"><span>삭제</span></span></button>');
    $group.find(".d-flex.justify-content-between").append(deleteBtn);
  }
});

  // 특이사항
  document.getElementById("special_note").value = rawData.special_note || "";

  // 제품정보 (나중에 별도 함수로 분리)
    // 기존 제품정보 영역 정리 (1개 남기고 삭제)
    $("#product_info_wrap .product-info-group").slice(1).remove();

    // 필요한 만큼 추가
    while ($("#product_info_wrap .product-info-group").length < rawData.products.length) {
        $("#addProduct").trigger("click");
    }

    // 제품별로 값 채우기
    $("#product_info_wrap .product-info-group").each(function (index) {
        const data = rawData.products[index];
        const container = $(this);

        container.find(".product-info-title").text(data.label || `제품정보${index + 1}`);
        container.find(".product").val(data.name || "").trigger("change");
        container.find(".model").val(data.model || "");
        container.find(".color").val(data.color || "");
        container.find(".regulation").val(data.regulation || "").trigger("change");
        container.find(".contract").val(data.contract || "").trigger("change");
        container.find(".management").val(data.management || "").trigger("change");
        container.find(".rental-fee").val(data.rental_fee || "");
        container.find(".commission-rate").val(data.commission_rate || "");

        // 프로모션
        const promoYes = container.find(".promotion-request-yes");
        const promoNo = container.find(".promotion-request-no");
        const promoText = container.find(".promotion-text");

        const savedPromotionText = (data.promotion || "").trim();
        const savedPromotionRequest = (data.promotion_request || "").trim();
        const isPromotionYes = savedPromotionText !== "" || savedPromotionRequest === "있음";

        if (isPromotionYes) {
            promoYes.prop("checked", true);
            promoNo.prop("checked", false);
            promoText.val(savedPromotionText).show();
            promoText.prop("required", true);
        } else {
            promoYes.prop("checked", false);
            promoNo.prop("checked", true);
            promoText.val("").hide();
            promoText.prop("required", false);
        }

        updatePromotionAutocomplete(container);

// 확인요청
// A >> B: 불러오기 시점에 disabled 잠시 해제 → 체크 여부 반영 → 다시 비활성화

// 사전답사
container.find(".pre-visit")

  container.find(".other-company-extra input[name$='type']").val(info.type);

  container.find(".other-company-extra input[name$='watermark']").val(info.watermark);
  container.find(".other-company-extra input[name$='install_year']").val(info.install_year);
}

        container.find(".hard-construction").prop("checked", !!data.hard_construction);

        // 타사정보
        const other = data.other_company_info;
        const otherCheck = container.find(".other-company");
        const otherSection = container.find(".other-company-extra");

        if (other) {
            otherCheck.prop("checked", true);
            otherSection.show();

            otherSection.find(".other-brand").val(other.brand || "");
            otherSection.find(".install-year").val(other.install_year || "");
            otherSection.find(".watermark-number").val(other.watermark || "");

            // 라디오 버튼 처리
            otherSection.find(`input[name="product_type_${index + 1}"][value="${other.type}"]`).prop("checked", true);
            otherSection.find(`input[name="product_kind_${index + 1}"][value="${other.kind}"]`).prop("checked", true);
            otherSection.find(`input[name="install_type_${index + 1}"][value="${other.install}"]`).prop("checked", true);
        } else {
            otherCheck.prop("checked", false);
            otherSection.hide();
        }
    });
}
