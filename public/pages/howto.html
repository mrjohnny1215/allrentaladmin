<script>
function syncPlayerPlacement(index) {
  const playerWrap = document.getElementById('guidePlayerWrap');
  const desktopPlayerHost = document.getElementById('desktopPlayerHost');

  if (!playerWrap || !desktopPlayerHost) return;

  if (window.innerWidth < 992) {
    const mobileSlot = document.getElementById('mobilePlayerSlot-' + index);
    if (mobileSlot) {
      mobileSlot.appendChild(playerWrap);
    }
  } else {
    desktopPlayerHost.appendChild(playerWrap);
  }
}

function showVideo(index, videoId, title) {
  const buttons = document.querySelectorAll('.guide-video-item');
  const viewerTitle = document.getElementById('viewerTitle');
  const player = document.getElementById('guidePlayer');
  const playerBox = document.getElementById('guidePlayerBox');
  const playerEmpty = document.getElementById('guidePlayerEmpty');
  const activeButton = document.querySelector('.guide-video-item[data-index="' + index + '"]');
  const playerWrap = document.getElementById('guidePlayerWrap');

  buttons.forEach(btn => btn.classList.remove('is-active'));

  if (activeButton) {
    activeButton.classList.add('is-active');
  }

  syncPlayerPlacement(index);

  if (viewerTitle) {
    viewerTitle.textContent = title;
  }

  playerEmpty.classList.add('d-none');
  playerBox.classList.remove('d-none');
  player.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0';

  if (window.innerWidth < 992 && playerWrap) {
    playerWrap.scrollIntoView({
      behavior: 'smooth',
      block: 'nearest'
    });
  }
}

document.addEventListener('DOMContentLoaded', function () {
  const firstButton = document.querySelector('.guide-video-item');
  if (firstButton && window.innerWidth >= 992) {
    firstButton.click();
  }
});

window.addEventListener('resize', function () {
  const activeButton = document.querySelector('.guide-video-item.is-active');
  if (!activeButton) return;

  const activeIndex = activeButton.getAttribute('data-index');
  syncPlayerPlacement(activeIndex);
});
</script>
